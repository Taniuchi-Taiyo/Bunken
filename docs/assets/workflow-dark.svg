<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Bunken workflow</title>
<desc id="d">DOI, arXiv, BibTeX or PDF go into Bunken, which organizes them; then export a BibTeX file, cite in LaTeX, or sync through a shared folder.</desc>
<rect width="1280" height="250" rx="16" fill="#1A1714"/>
<rect x="0.5" y="0.5" width="1279" height="249" rx="15.5" fill="none" stroke="#2E2B28"/>
<text x="48" y="42" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#6B6560">ADD</text>
<text x="450" y="42" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#6B6560">ORGANIZE</text>
<text x="960" y="42" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#6B6560">USE</text>
<rect x="48" y="78" width="130" height="50" rx="8" fill="#252220" stroke="#2E2B28"/><text x="113.0" y="108.25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDE9E1">DOI</text>
<rect x="190" y="78" width="130" height="50" rx="8" fill="#252220" stroke="#2E2B28"/><text x="255.0" y="108.25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDE9E1">arXiv</text>
<rect x="48" y="140" width="130" height="50" rx="8" fill="#252220" stroke="#2E2B28"/><text x="113.0" y="170.25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDE9E1">BibTeX</text>
<rect x="190" y="140" width="130" height="50" rx="8" fill="#252220" stroke="#2E2B28"/><text x="255.0" y="170.25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDE9E1">PDF</text>
<line x1="340" y1="134" x2="428" y2="134" stroke="#6B6560" stroke-width="2" stroke-linecap="round"/><path d="M424 128 L436 134 L424 140" fill="none" stroke="#6B6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="450" y="66" width="400" height="136" rx="12" fill="#1A2A3A" stroke="#7EB8F7" stroke-width="1.5"/>
<text x="650" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#EDE9E1">Bunken</text>
<text x="650" y="148" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="15" fill="#EDE9E1">tags · collections · reading status · notes</text>
<text x="650" y="174" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="13" fill="#9A948C">PDFs and supplementary files stored automatically</text>
<line x1="868" y1="134" x2="936" y2="134" stroke="#6B6560" stroke-width="2" stroke-linecap="round"/><path d="M932 128 L944 134 L932 140" fill="none" stroke="#6B6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
