<rect x="960" y="116" width="272" height="44" rx="8" fill="#252220" stroke="#2E2B28"/><text x="1096.0" y="143.25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EDE9E1">\cite{key} in LaTeX</text>
<rect x="960" y="170" width="272" height="44" rx="8" fill="#252220" stroke="#2E2B28"/><text x="1096.0" y="196.9" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="#EDE9E1">Dropbox / Google Drive sync</text>
