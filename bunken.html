/* ============================================================
   BIBTEX GENERATOR
   Stored text may contain <sub>/<sup>/<i>, Unicode dashes, accents,
   & % _ # ... -> convert to valid LaTeX so exported .bib files compile.
============================================================ */
const TEX_ACCENT_INV = { '̈': '"', '́': "'", '̀': '`', '̂': '^', '̃': '~', '̄': '=', '̇': '.', '̧': 'c', '̨': 'k', '̌': 'v', '̆': 'u', '̋': 'H', '̊': 'r' };
const TEX_CHAR_MAP = { 'ß': '{\\ss}', 'ø': '{\\o}', 'Ø': '{\\O}', 'ł': '{\\l}', 'Ł': '{\\L}', 'æ': '{\\ae}', 'Æ': '{\\AE}', 'œ': '{\\oe}', 'Œ': '{\\OE}', 'ı': '{\\i}', '–': '--', '—': '---', '‘': '`', '’': "'", '“': '``', '”': "''", ' ': '~', '…': '\\ldots{}' };
const TEX_MATH_MAP = { '×': '\\times ', '±': '\\pm ', '°': '^{\\circ}', '−': '-', '·': '\\cdot ', '≈': '\\approx ', '∼': '\\sim ', '≤': '\\leq ', '≥': '\\geq ', '≠': '\\neq ', '→': '\\rightarrow ', '←': '\\leftarrow ', '↔': '\\leftrightarrow ', '⇌': '\\rightleftharpoons ', '∞': '\\infty ', 'µ': '\\mu ' };
for (const [name, ch] of Object.entries(TEX_GREEK)) if (!/^var/.test(name)) TEX_MATH_MAP[ch] = `\\${name} `;

function texEscapeText(text, inMath, accents) {
  let s = String(text).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  const esc = { '\\': '\\textbackslash{}', '{': '\\{', '}': '\\}', '&': '\\&', '%': '\\%', '#': '\\#', '_': '\\_', '$': '\\$', '^': '\\^{}', '~': '\\textasciitilde{}', '<': inMath ? '<' : '$<$', '>': inMath ? '>' : '$>$' };
  s = s.replace(/[\\{}&%#_$^~<>]/g, ch => esc[ch]);
  if (accents && !inMath) {
    s = s.normalize('NFD').replace(/([A-Za-z])([̀-̨̊-̌])/g, (all, base, mark) => {
      const acc = TEX_ACCENT_INV[mark];
      if (!acc) return all;
      if (/[A-Za-z]/.test(acc)) return `{\\${acc} ${base}}`;
      return `{\\${acc}${base === 'i' || base === 'j' ? '\\' + base : base}}`;
    }).normalize('NFC');
  }
  return s.replace(/[^\x00-\x7f]/g, ch => {
    if (inMath) return TEX_MATH_MAP[ch] ?? ch;
    if (TEX_CHAR_MAP[ch]) return TEX_CHAR_MAP[ch];
    if (TEX_MATH_MAP[ch]) return `$${TEX_MATH_MAP[ch].trim()}$`;
    return ch;
  });
}

function bibToTex(value, opts = {}) {
  const src = cleanBibText(value, true);
  if (!src) return '';
  const accents = opts.accents !== false;
  let out = '', math = false;
  for (const part of src.split(/(<\/?(?:sub|sup|i|b)>)/)) {
    const tag = part.match(/^<(\/?)(sub|sup|i|b)>$/);
    if (!tag) { out += texEscapeText(part, math, accents); continue; }
    const closing = !!tag[1], name = tag[2];
    if (name === 'sub' || name === 'sup') {
      out += closing ? '}$' : (name === 'sub' ? '$_{' : '$^{');
      math = !closing;
    } else {
      out += closing ? '}' : (name === 'i' ? '\\textit{' : '\\textbf{');
    }
  }
  return out;
}

function genBib(p, options = {}) {
  const includeAbstract = options.includeAbstract === true;
  const tMap = { article:'article', inproceedings:'inproceedings', book:'book', preprint:'misc', misc:'misc', phdthesis:'phdthesis', mastersthesis:'mastersthesis' };
  const entryType = tMap[p.type] || 'misc';
  const k = normalizeBibKey(options.key || p.bibtexKey || bKey(p)) || 'reference';
  const fields = [];
  const f = (name, value, mode = 'text') => {
    if (value == null || value === '') return;
    const converted = mode === 'literal' ? bibToTex(String(value), { accents: false }) : bibToTex(value);
    fields.push([name, converted]);
  };
  if (p.authors?.length) {
    // A name that itself contains " and " (e.g. a corporate author) must stay braced,
    // otherwise BibTeX would split it into several authors.
    const names = p.authors.map(a => { const s = bibToTex(a); return / and /i.test(s) ? `{${s}}` : s; }).filter(Boolean);
    if (names.length) fields.push(['author', names.join(' and ')]);
  }
  if (p.title) fields.push(['title', `{${bibToTex(p.title)}}`]);
  if (p.type === 'article') f('journal', p.journal);
  if (p.type === 'inproceedings') f('booktitle', p.booktitle || p.journal);
  f('year', p.year, 'literal');
  if (['article', 'inproceedings'].includes(p.type)) {
    f('volume', p.volume); f('number', p.number);
    const pages = bibToTex(p.pages || '').replace(/(?<=\w)-(?=\w)/g, '--');
    if (pages) fields.push(['pages', pages]);
  }
  if (p.publisher) f('publisher', p.publisher);
  if (['phdthesis', 'mastersthesis'].includes(p.type)) f('school', p.school || p.publisher);
  if (p.type === 'misc' && p.school) f('institution', p.school);
  f('doi', normalizeDoi(p.doi), 'literal');
  if (p.arxivId) {
    f('eprint', normalizeArxivId(p.arxivId), 'literal');
    f('archivePrefix', p.archivePrefix || 'arXiv', 'literal');
    f('primaryClass', p.primaryClass, 'literal');
  }
  if (!p.doi && !p.arxivId) f('url', p.url, 'literal');
  if (includeAbstract) f('abstract', p.abstract);
  const width = Math.max(4, ...fields.map(([name]) => name.length));
  const lines = fields.map(([name, value], index) =>
    `  ${name.padEnd(width)} = {${value}}${index < fields.length - 1 ? ',' : ''}`
  );
  return [`@${entryType}{${k},`, ...lines, '}', ''].join('\n');
}

/* ============================================================
   CROSSREF FETCH
============================================================ */
async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (error) {
    if (error?.name === 'AbortError') throw new Error(t('通信がタイムアウトしました'));
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchDOI(raw) {
  const doi = normalizeDoi(raw);
  if (!/^10\.\d{4,9}\/.+/.test(doi)) throw new Error(t('DOIの形式を確認してください'));
  const w = await fetchCrossrefWorkByDoi(doi);
  return {
    id: uid(), bibtexKey: '', arxivId: '',
    tags: [], collections: [], starred: false, readStatus: 'unread', notes: '',
    addedAt: new Date().toISOString(),
    ...w
  };
}

/* ============================================================
   ARXIV FETCH
============================================================ */
async function fetchArxiv(raw) {
  const id = normalizeArxivId(raw);
  if (!/^(?:\d{4}\.\d{4,5}|[a-z][\w.-]+\/\d{7})$/i.test(id)) throw new Error(t('arXiv IDの形式を確認してください'));
  const res = await fetchWithTimeout(`https://export.arxiv.org/api/query?id_list=${id}`);
  if (!res.ok) throw new Error(t('arXivに接続できません'));
  const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
  const entry = xml.querySelector('entry');
  if (!entry) throw new Error(t('arXiv IDが見つかりません'));
  const title = texToText(entry.querySelector('title')?.textContent?.trim().replace(/\s+/g,' ')||'', true, { tilde: false });
  const summary = texToText(entry.querySelector('summary')?.textContent?.trim().replace(/\s+/g,' ')||'', false, { tilde: false });
  const published = entry.querySelector('published')?.textContent||'';
  const year = published ? parseInt(published.slice(0,4)) : null;
  const authors = Array.from(entry.querySelectorAll('author name')).map(n => {
    const nm = n.textContent.trim(), pts = nm.split(' ');
    return pts.length >= 2 ? `${pts[pts.length-1]}, ${pts.slice(0,-1).join(' ')}` : nm;
  });
  const doi = entry.querySelector('doi')?.textContent?.trim()||'';
  const jref = entry.querySelector('journal_ref')?.textContent?.trim()||'';
  return {
    id: uid(), type: 'preprint', bibtexKey: '', title, authors, year,
    journal: jref||'arXiv', booktitle:'', volume:'', number:'', pages:'', publisher:'', school:'',
    doi, arxivId: id, archivePrefix:'arXiv', primaryClass:'', url: `https://arxiv.org/abs/${id}`, abstract: summary,
    citationCount: null, tags: [], collections: [], starred: false,
    readStatus: 'unread', notes: '', addedAt: new Date().toISOString(),
    pdfId: '', pdfName: '', pdfOriginalName: '', pdfPath: '', hasPdf: false, supplementalFiles: []
  };
}

/* ============================================================
   PDF METADATA
============================================================ */
const DOI_RE = /\b10\.\d{4,9}\/[-._;()/:A-Z0-9]+/ig;

function normalizeDoi(value) {
  return String(value || '').trim()
    .replace(/^https?:\/\/(?:dx\.)?doi\.org\//i, '')
    .replace(/^doi:\s*/i, '')
    .replace(/\s+/g, '')
    .replace(/[.,;:)\]}]+$/, '');
}

function normalizeArxivId(value) {
  return String(value || '').trim()
    .replace(/^arxiv:\s*/i, '')
    .replace(/^https?:\/\/arxiv\.org\/(?:abs|pdf)\//i, '')
    .replace(/\.pdf$/i, '')
    .replace(/v\d+$/i, '')
    .replace(/\s+/g, '');
}

function normalizeBibKey(value) {
  return sanitizeText(value, 120)
    .trim()
    .replace(/\s+/g, '-')
    .replace(/[^A-Za-z0-9:_./+\-]/g, '');
}

function findDoi(text) {
  const match = String(text || '').match(DOI_RE);
  return match ? normalizeDoi(match[0]) : '';
}

function crossrefDate(message) {
  for (const key of ['published-print', 'published-online', 'published', 'issued', 'approved']) {
    const parts = message?.[key]?.['date-parts']?.[0];
    if (parts?.[0]) return parts[0];
  }
  return null;
}

function crossrefPaper(message, fallbackDoi = '') {
  const doi = normalizeDoi(message?.DOI || fallbackDoi);
  const authors = (message?.author || []).map(a =>
    a.family && a.given ? `${a.family}, ${a.given}` : a.family || a.name || ''
  ).filter(Boolean);
  return {
    type: message?.type === 'proceedings-article' ? 'inproceedings' : 'article',
    title: (message?.title || [''])[0] || '', authors, year: crossrefDate(message),
    journal: (message?.['container-title'] || [])[0] || message?.publisher || '',
    volume: message?.volume || '', number: message?.issue || '', pages: message?.page || '',
    publisher: message?.publisher || '', doi,
    url: doi ? `https://doi.org/${encodeURIComponent(doi).replace(/%2F/g, '/')}` : (message?.URL || ''),
    abstract: message?.abstract || '',
    citationCount: message?.['is-referenced-by-count'] ?? null
  };
}

async function fetchCrossrefWorkByDoi(doi) {
  const res = await fetchWithTimeout(`https://api.crossref.org/works/${encodeURIComponent(normalizeDoi(doi))}`);
  if (!res.ok) throw new Error(t('DOIが見つかりません（CrossRef）'));
  const { message } = await res.json();
  return crossrefPaper(message, doi);
}

function titleSimilarity(left, right) {
  const words = value => new Set(cleanBibText(value).toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, ' ').split(/\s+/).filter(w => w.length > 2));
  const a = words(left), b = words(right);
  if (!a.size || !b.size) return 0;
  let common = 0;
  for (const word of a) if (b.has(word)) common++;
  return common / Math.max(a.size, b.size);
}

async function fetchCrossrefWorkByTitle(title) {
  if (!title) return null;
  const url = `https://api.crossref.org/works?query.bibliographic=${encodeURIComponent(title)}&rows=5`;
  const res = await fetchWithTimeout(url);
  if (!res.ok) return null;
  const items = (await res.json()).message?.items || [];
  let best = null;
  for (const item of items) {
    const candidate = crossrefPaper(item);
    const similarity = titleSimilarity(title, candidate.title);
    if (!best || similarity > best.similarity) best = { candidate, similarity };
  }
  return best && best.similarity >= 0.6 ? best.candidate : null;
}

function cleanPdfTitle(raw) {
  const s = cleanBibText(raw, true);
  // generic / filename-like metadata titles are not real titles
  if (!s || /^(untitled|microsoft word\b.*|.*\.(docx?|pdf|tex|indd|qxd|dvi|ps)|[\w.\-]{20,})$/i.test(s)) return '';
  return s;
}

function bestPdfTitle(items) {
  const candidates = (items || []).map(item => ({
    text: String(item.str || '').trim(), size: Math.abs(item.transform?.[0] || 0), y: item.transform?.[5] || 0
  })).filter(item => item.text.length > 8 && !/^https?:\/\//i.test(item.text));
  candidates.sort((a, b) => b.size - a.size || b.y - a.y);
  return candidates[0]?.text || '';
}

async function extractPDF(file) {
  const pdfJs = await getPdfJsLib();
  const buf = await file.arrayBuffer();
  const pdf = await pdfJs.getDocument({ data: buf }).promise;
  const meta = await pdf.getMetadata();
  const infoValues = Object.values(meta.info || {}).join(' ');
  let title = cleanPdfTitle(meta.info?.Title);
  let author = meta.info?.Author || '';
  let firstPageItems = [];
  let extractedText = infoValues;
  for (let pageNumber = 1; pageNumber <= Math.min(pdf.numPages, 3); pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const tc = await page.getTextContent();
    if (pageNumber === 1) firstPageItems = tc.items;
    extractedText += `\n${tc.items.map(item => item.str || '').join(' ')}`;
  }
  if (!title || /^untitled$/i.test(title)) title = bestPdfTitle(firstPageItems);
  const doi = findDoi(extractedText);
  let resolved = null;
  try {
    resolved = doi ? await fetchCrossrefWorkByDoi(doi) : await fetchCrossrefWorkByTitle(title);
  } catch (e) { console.warn('PDF bibliographic lookup skipped', e); }
  const localAuthors = author ? author.split(/[,;]/).map(a=>a.trim()).filter(Boolean) : [];
  return normalizePaper({
    id: uid(), type: 'article', bibtexKey: '', title, authors: localAuthors,
    year: null, journal:'', volume:'', number:'', pages:'', publisher:'',
    doi, arxivId:'', url:'', abstract:'', citationCount: null,
    tags: [], collections: [], starred: false, readStatus: 'unread', notes: '',
    addedAt: new Date().toISOString(),
    pdfId: '', pdfName: file.name || '', pdfOriginalName: file.name || '', pdfPath: '', hasPdf: false,
    supplementalFiles: [], ...resolved,
    authors: resolved?.authors?.length ? resolved.authors : localAuthors,
    title: resolved?.title || title, doi: resolved?.doi || doi
  });
}
function filtered() {
  let pp = [...S.papers];
  if (S.view === 'starred')        pp = pp.filter(p => p.starred);
  else if (S.view === 'unread')    pp = pp.filter(p => p.readStatus==='unread');
  else if (S.view === 'reading')   pp = pp.filter(p => p.readStatus==='reading');
  else if (S.view === 'read')      pp = pp.filter(p => p.readStatus==='read');
  else if (S.view.startsWith('col:')) { const c=S.view.slice(4); pp=pp.filter(p=>(p.collections||[]).includes(c)); }
  else if (S.view.startsWith('tag:')) { const tg=S.view.slice(4); pp=pp.filter(p=>(p.tags||[]).includes(tg)); }

  if (S.filters.search) {
    const q = S.filters.search.toLowerCase();
    pp = pp.filter(p =>
      plainText(p.title||'').toLowerCase().includes(q) ||
      (p.authors||[]).join(' ').toLowerCase().includes(q) ||
      (p.abstract||'').toLowerCase().includes(q) ||
      (p.tags||[]).join(' ').toLowerCase().includes(q) ||
      (p.notes||'').toLowerCase().includes(q) ||
      [p.journal, p.booktitle, p.publisher, p.school].filter(Boolean).join(' ').toLowerCase().includes(q)
    );
  }
  if (S.filters.author) {
    const a = S.filters.author.toLowerCase();
    pp = pp.filter(p => (p.authors||[]).join(' ').toLowerCase().includes(a));
  }
  if (S.filters.year)    pp = pp.filter(p => String(p.year) === S.filters.year);
  if (S.filters.journal) {
    const j = S.filters.journal.toLowerCase();
    pp = pp.filter(p => [p.journal, p.booktitle, p.publisher, p.school].filter(Boolean).join(' ').toLowerCase().includes(j));
  }

  pp.sort((a,b) => {
    switch(S.sortBy) {
      case 'year':         return (b.year||0)-(a.year||0);
      case 'title':        return (a.title||'').localeCompare(b.title||'');
      case 'citationCount':return (b.citationCount||0)-(a.citationCount||0);
      default:             return new Date(b.addedAt)-new Date(a.addedAt);
    }
  });
  return pp;
}

function updateFilters() {

    document.getElementById(id).innerHTML = `<option value="">${{fa:t('著者…'),fy:t('年…'),fj:t('誌名…')}[id]}</option>` +
      [...vals].sort().reverse().map(v=>`<option value="${h(v)}"${cur===v?' selected':''}>${h(v)}</option>`).join('');

function addTag(id, tag) {
  tag = tag.trim().replace(/,/g,'').replace(/;/g,'').slice(0,30);
  if (!tag) return;
  const p = S.papers.find(q=>q.id===id);
  if (p && !(p.tags||[]).includes(tag)) { p.tags.push(tag); save(); render(); }
}
function rmTagBtn(btn) {
  const id=btn.dataset.id, tag=btn.dataset.tag;

  if (p) { p.tags=p.tags.filter(x=>x!==tag); save(); render(); }
}
function tagKeydown(e, id) {
  if (e.key==='Enter'||e.key===',') { addTag(id,e.target.value); e.target.value=''; e.preventDefault(); }
}

function setCol(id, collectionIds) {
  const p=S.papers.find(q=>q.id===id);
  if (p) {
    const validIds = new Set(S.collections.map(c=>c.id));
    p.collections = [...new Set((Array.isArray(collectionIds) ? collectionIds : [collectionIds])
      .filter(colId => colId && validIds.has(colId)))];
    save(); render();
  }
}
function updNotes(id, v) { const p=S.papers.find(q=>q.id===id); if(p){p.notes=v;save();} }

async function delPaper(id) {
  if (!confirm(t('この文献を削除しますか？'))) return;
  const paper = S.papers.find(p=>p.id===id);
  if (paper?.hasPdf) {
    try { await deletePdfBlob(paper.pdfId || id); } catch(e) { console.error(e); }
    if (STORAGE_STATE.folderHandle && paper.pdfPath) { try { await removeRelativePath(STORAGE_STATE.folderHandle, paper.pdfPath); } catch(e) { console.error(e); } }
  }
  for (const fileMeta of (paper?.supplementalFiles || [])) {
    try { await deleteMaterialBlob(fileMeta.id); } catch(e) { console.error(e); }
    if (STORAGE_STATE.folderHandle && fileMeta.path) { try { await removeRelativePath(STORAGE_STATE.folderHandle, fileMeta.path); } catch(e) { console.error(e); } }
  }
  S.papers = S.papers.filter(p=>p.id!==id);
  if (S.selectedId===id) S.selectedId=null;
  save(); render(); toast(t('文献を削除しました'));
}

function addCollection() {
  const name = prompt(t('コレクション名:'));
  if (name && name.trim()) { S.collections.push(normalizeCollection({id:uid(),name:name.trim()})); save(); render(); }
}

function renameCollection(id) {
  const collection = S.collections.find(c => c.id === id);
  if (!collection) return;
  const name = prompt(t('新しいコレクション名:'), collection.name);
  if (name == null) return;
  const trimmed = name.trim();
  if (!trimmed || trimmed === collection.name) return;
  collection.name = sanitizeText(trimmed, 80) || collection.name;
  save(); render(); toast(t('コレクション名を更新しました'));
}

function deleteCollection(id) {
  const collection = S.collections.find(c => c.id === id);
  if (!collection) return;
  if (!confirm(t('「{name}」を削除しますか？', { name: collection.name }))) return;
  S.collections = S.collections.filter(c => c.id !== id);
  S.papers.forEach(p => {
    if ((p.collections || []).includes(id)) p.collections = p.collections.filter(colId => colId !== id);
  });
  if (S.view === 'col:' + id) S.view = 'all';
  save(); render(); toast(t('コレクションを削除しました'));
}

function moveCollection(id, direction) {
  const index = S.collections.findIndex(c => c.id === id);
  if (index === -1) return;
  const target = direction === 'up' ? index - 1 : index + 1;
  if (target < 0 || target >= S.collections.length) return;
  const next = [...S.collections];
  [next[index], next[target]] = [next[target], next[index]];
  S.collections = next;
  save(); render();
}

async function handleExistingPaperPdf(input) {

  const file = input.files && input.files[0];
  input.value = '';

  await attachPdfToPaper(id, file);

async function attachPdfToPaper(id, file) {
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) {
    toast(t('PDF ファイルを選択してください'));
    return;
  }
  const paper = S.papers.find(p => p.id === id);
  if (!paper) return;
  try {
    let extracted = null;
    try { extracted = await extractPDF(file); } catch (e) { console.warn(e); }
    const pdfBlobId = paper.pdfId || id;
    await putPdfBlob(pdfBlobId, file);
    paper.pdfId = pdfBlobId;
    paper.pdfOriginalName = file.name || 'document.pdf';
    paper.hasPdf = true;
    if (!plainText(paper.title) && extracted?.title) paper.title = extracted.title;
    if ((!paper.authors || !paper.authors.length) && extracted?.authors?.length) paper.authors = extracted.authors;
    paper.pdfName = buildStoredFileName(paper, { kind: 'pdf', ext: 'pdf' });
    save();
    if (STORAGE_STATE.folderHandle) await syncAllDataToChosenFolder(false);
    render();
    toast(STORAGE_STATE.folderHandle ? t('PDF を添付して保存先へコピーしました') : t('PDF を添付しました'));
  } catch (e) {
    console.error(e);
    alert(t('PDF の添付に失敗しました: ') + e.message);
  }
}

async function removeAttachedPdf(id) {
  const paper = S.papers.find(p => p.id === id);
  if (!paper || !paper.hasPdf) return;
  if (!confirm(t('添付PDFを外しますか？'))) return;
  try {
    await deletePdfBlob(paper.pdfId || id);
    if (STORAGE_STATE.folderHandle && paper.pdfPath) { try { await removeRelativePath(STORAGE_STATE.folderHandle, paper.pdfPath); } catch (e) { console.error(e); } }
    paper.pdfId = '';
    paper.pdfName = '';
    paper.pdfOriginalName = '';
    paper.pdfPath = '';
    paper.hasPdf = false;
    save();
    render();
    toast(t('PDF を外しました'));
  } catch (e) {
    console.error(e);
    alert(t('PDF の削除に失敗しました: ') + e.message);
  }
}

async function handleExistingPaperSupplement(input) {
  const id = input.dataset.paperId;
  const files = Array.from(input.files || []);
  input.value = '';
  if (!id || !files.length) return;
  await attachSupplementToPaper(id, files);
}

async function attachSupplementToPaper(id, files) {
  const paper = S.papers.find(p => p.id === id);
  if (!paper) return;
  const added = [];
  try {
    for (const file of files) {
      const fileId = uid();
      const slot = nextSupplementSlot(paper);
      await putMaterialBlob(fileId, file);
      const ext = getFileExtension(file.name || 'attachment', file.type || 'application/octet-stream', 'bin');
      const meta = {
        id: fileId,
        name: buildStoredFileName(paper, { kind: 'supplement', slot, ext }),
        originalName: file.name || 'attachment',
        path: '',
        type: file.type || 'application/octet-stream',
        size: file.size || 0,
        updatedAt: new Date().toISOString(),
        slot
      };
      paper.supplementalFiles = [...(paper.supplementalFiles || []), meta];
      added.push(meta);
    }
    save();
    if (STORAGE_STATE.folderHandle) await syncAllDataToChosenFolder(false);
    render();
    toast(STORAGE_STATE.folderHandle ? t('{n} 件の補足資料を追加して保存先へコピーしました', { n: added.length }) : t('{n} 件の補足資料を追加しました', { n: added.length }));
  } catch (e) {
    console.error(e);
    for (const meta of added) {
      try { await deleteMaterialBlob(meta.id); } catch (_) {}
      paper.supplementalFiles = (paper.supplementalFiles || []).filter(f => f.id !== meta.id);
    }
    alert(t('補足資料の追加に失敗しました: ') + e.message);
  }
}

async function removeSupplement(paperId, fileId) {
  const paper = S.papers.find(p => p.id === paperId);
  const fileMeta = (paper?.supplementalFiles || []).find(f => f.id === fileId);
  if (!paper || !fileMeta) return;
  if (!confirm(t('「{name}」を削除しますか？', { name: fileMeta.name }))) return;
  try {
    await deleteMaterialBlob(fileId);
    if (STORAGE_STATE.folderHandle && fileMeta.path) { try { await removeRelativePath(STORAGE_STATE.folderHandle, fileMeta.path); } catch (e) { console.error(e); } }

  } catch (e) {
    console.error(e);

}

async function doFetch() {
  const val = document.getElementById('doi-in').value.trim();
  if (!val) return;
  const btn=document.getElementById('fetch-btn'), st=document.getElementById('fetch-st'), pv=document.getElementById('fetch-pv');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> ' + t('取得中…');
  st.textContent=''; st.className='fs'; pv.classList.remove('on');
  try {
    const isArxiv = /^\d{4}\.\d+/.test(val) || /^[a-z\-]+\/\d/i.test(val) || /arxiv/i.test(val);
    const paper = normalizePaper(isArxiv ? await fetchArxiv(val) : await fetchDOI(val));
    M.pending = paper;
    st.textContent=t('✓ 取得成功！'); st.className='fs ok';
    pv.classList.add('on');
    pv.innerHTML=`<strong>${richInline(paper.title)}</strong>${(paper.authors||[]).slice(0,3).map(a=>a.split(',')[0]).join(', ')} · ${paper.year||'—'} · ${h(paper.journal||'')}${paper.citationCount!=null?`<br><small>${t('被引用数')}: ${paper.citationCount}</small>`:''}`;
  } catch(e) { st.textContent=`✕ ${e.message}`; st.className='fs err'; }
  finally { btn.disabled=false; btn.innerHTML=t('🔍 取得'); }
}

function doParseBib() {
  const txt=document.getElementById('bib-in').value;
  const st=document.getElementById('bib-st'), pv=document.getElementById('bib-pv');
  try {
    const papers = parseBibEntries(txt).map(normalizePaper);
    if (!papers.length) throw new Error(t('BibTeXエントリが見つかりません'));
    M.pending = papers.length === 1 ? papers[0] : papers;
    st.textContent=t('✓ {n} 件を解析しました', { n: papers.length }); st.className='fs ok';
    pv.classList.add('on');
    pv.innerHTML = papers.slice(0, 5).map(p => `<strong>${richInline(p.title||t('（タイトルなし）'))}</strong>${h((p.authors||[]).slice(0,3).join(', '))} · ${p.year||'—'}`).join('') +
      (papers.length > 5 ? `<small>${t('ほか {n} 件', { n: papers.length - 5 })}</small>` : '');
  } catch (e) {
    M.pending=null; pv.classList.remove('on');
    st.textContent=`✕ ${e.message || t('BibTeXの解析に失敗しました')}`; st.className='fs err';
  }
}

async function saveModal() {
  let paper = null;
  if (M.tab==='manual' || M.editId) {
    paper = readManualForm(M.editId||null);
    if (!paper.title) { alert(t('タイトルを入力してください')); return; }
  } else {
    if (!M.pending) {
      alert(M.tab==='doi'?t('まず「取得」ボタンを押してください'):M.tab==='bibtex'?t('まず「解析する」ボタンを押してください'):t('まずPDFを選択してください'));
      return;
    }
    paper = M.pending;
  }
  const incoming = Array.isArray(paper) ? paper : [paper];
  const usedKeys = new Set();
  const existingPapers = S.papers.filter(p => p.id !== (M.editId || ''));
  const usedDois = new Set(existingPapers.map(p => normalizeDoi(p.doi).toLowerCase()).filter(Boolean));
  const usedArxivIds = new Set(existingPapers.map(p => normalizeArxivId(p.arxivId).toLowerCase()).filter(Boolean));
  for (const item of incoming) {
    if (!plainText(item.title || '').trim()) {
      alert(t('Citation key「{key}」にタイトルがありません。', { key: item.bibtexKey || t('未設定') }));
      return;
    }
    const doi = normalizeDoi(item.doi).toLowerCase();
    const arxivId = normalizeArxivId(item.arxivId).toLowerCase();
    if (doi && usedDois.has(doi)) { alert(t('DOI「{doi}」の文献は既に登録されています。', { doi: item.doi })); return; }
    if (arxivId && usedArxivIds.has(arxivId)) { alert(t('arXiv「{id}」の文献は既に登録されています。', { id: item.arxivId })); return; }
    if (doi) usedDois.add(doi);
    if (arxivId) usedArxivIds.add(arxivId);
    if (!item.bibtexKey) item.bibtexKey = nextAvailableBibKey(bKey(item), usedKeys, M.editId || '');
    item.bibtexKey = normalizeBibKey(item.bibtexKey);
    if (!item.bibtexKey) { alert(t('Citation keyを英数字で入力してください')); return; }
    const keyLower = item.bibtexKey.toLowerCase();
    if (usedKeys.has(keyLower) || findDuplicateBibKey(item.bibtexKey, M.editId || '')) {
      alert(t('Citation key「{key}」は既に使われています。別のキーへ変更してください。', { key: item.bibtexKey }));
      return;
    }
    usedKeys.add(keyLower);
  }
  if (incoming.length > 1) {
    S.papers.unshift(...incoming);
    S.selectedId = incoming[0].id;
    save(); closeModal('add-modal'); render();
    toast(t('{n} 件の文献を追加しました', { n: incoming.length }));
    return;
  }
  paper = incoming[0];
  if (paper._pdfFile) {
    paper.pdfId = paper.pdfId || paper.id;
    try {
      await putPdfBlob(paper.pdfId || paper.id, paper._pdfFile);
      paper.hasPdf = true;
    } catch (e) {
      console.error(e);
      alert(t('PDF の保存に失敗しました: ') + e.message);
      return;
    }
    delete paper._pdfFile;
  }
  if (M.editId) {
    const i=S.papers.findIndex(p=>p.id===M.editId);
    if (i!==-1) {
      const prev = S.papers[i];
      paper.hasPdf = paper.hasPdf || prev.hasPdf || false;
      paper.pdfId = paper.pdfId || prev.pdfId || '';
      paper.pdfName = paper.pdfName || prev.pdfName || '';
      paper.supplementalFiles = paper.supplementalFiles || prev.supplementalFiles || [];
      S.papers[i]=paper;
    }
    toast(t('文献を更新しました'));
  } else {
    S.papers.unshift(paper);
    S.selectedId=paper.id;
    toast(t('文献を追加しました'));
  }
  save(); closeModal('add-modal'); render();
}

/* ============================================================
   DUPLICATE CHECK
============================================================ */
function normalizeDuplicateDoi(value) {
  return sanitizeText(value, 256)
    .replace(/^https?:\/\/(dx\.)?doi\.org\//i, '')
    .replace(/^doi:/i, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

function normalizeDuplicateArxiv(value) {
  return sanitizeText(value, 128)
    .replace(/^https?:\/\/arxiv\.org\/(abs|pdf)\//i, '')
    .replace(/\.pdf$/i, '')
    .replace(/v\d+$/i, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

function normalizeDuplicateTitle(value) {
  return plainText(value || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\\/：:;,.，．。()[\]{}「」『』\"'`!?！？\-_–—]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function duplicateKeysForPaper(paper) {
  const keys = [];
  const doi = normalizeDuplicateDoi(paper.doi || '');
  if (doi) keys.push({ key: 'doi:' + doi, label: 'DOI: ' + doi });
  const arxiv = normalizeDuplicateArxiv(paper.arxivId || '');
  if (arxiv) keys.push({ key: 'arxiv:' + arxiv, label: 'arXiv: ' + arxiv });
  const title = normalizeDuplicateTitle(paper.title || '');
  if (title.length >= 12) keys.push({ key: 'title:' + title, label: 'Title: ' + title });
  return keys;
}

function findCollectionDuplicates(collectionId) {
  const groups = new Map();
  S.papers
    .filter(p => (p.collections || []).includes(collectionId))
    .forEach(p => {
      duplicateKeysForPaper(p).forEach(key => {
        if (!groups.has(key.key)) groups.set(key.key, { key: key.key, label: key.label, papers: [] });
        groups.get(key.key).papers.push(p);
      });
    });
  const seen = new Set();
  return [...groups.values()]
    .filter(g => g.papers.length >= 2)
    .filter(g => {
      const sig = g.papers.map(p => p.id).sort().join('|');
      if (seen.has(sig)) return false;
      seen.add(sig);
      return true;
    })
    .sort((a, b) => b.papers.length - a.papers.length || a.label.localeCompare(b.label));
}

function openDuplicateModal(collectionId) {
  const collection = S.collections.find(c => c.id === collectionId);
  if (!collection) return;
  D.collectionId = collectionId;
  lastModalTrigger = document.activeElement;
  D.groups = findCollectionDuplicates(collectionId);
  const title = document.getElementById('dup-modal-title');
  if (title) title.textContent = `${t('重複チェック')} — ${collection.name}`;
  renderDuplicateModalBody();
  document.getElementById('dup-modal').classList.add('open');

}

function renderDuplicateModalBody() {
  const body = document.getElementById('dup-modal-body');
  if (!body) return;
  const collection = S.collections.find(c => c.id === D.collectionId);
  if (!collection) {
    body.innerHTML = `<div class="dup-empty">${t('コレクションが見つかりません')}</div>`;
    return;
  }
  const totalDupPapers = D.groups.reduce((sum, group) => sum + group.papers.length, 0);
  if (!D.groups.length) {
    body.innerHTML = `<div class="dup-empty">${t('「{name}」内に重複候補はありません', { name: h(collection.name) })}</div>`;
    return;
  }
  body.innerHTML = `
    <div class="dup-summary">
      ${t('「{name}」内で {groups} 組 / {papers} 件の重複候補が見つかりました。', { name: h(collection.name), groups: D.groups.length, papers: totalDupPapers })}<br>
      ${t('「これを残す」を押すと、同じ組の他の文献をこのコレクションから外します（ライブラリ本体からは削除しません）。')}
    </div>
    <div class="dup-list">
      ${D.groups.map((group, gi) => `
        <div class="dup-group">
          <div class="dup-key">${h(group.label)}</div>
          ${group.papers.map(p => {
            const authors = (p.authors || []).slice(0, 3).map(a => a.split(',')[0].trim()).join(', ') || t('著者不明');
            const meta = [authors, p.year || '', p.journal || '', p.doi ? `DOI: ${p.doi}` : '', p.arxivId ? `arXiv: ${p.arxivId}` : ''].filter(Boolean).join(' · ');
            return `<div class="dup-paper">
              <div class="dup-paper-main">
                <div class="dup-title">${richInline(p.title || t('（タイトルなし）'))}</div>
                <div class="dup-meta">${h(meta)}</div>
              </div>
              <div class="dup-actions">
                <button type="button" class="btn-sec" data-action="resolve-duplicate-group" data-group="${gi}" data-id="${h(p.id)}">${t('これを残す')}</button>
                <button type="button" class="btn-del" data-action="remove-duplicate-from-collection" data-id="${h(p.id)}">${t('外す')}</button>
              </div>
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>`;
}

function removePaperFromCollection(paperId, collectionId) {
  const paper = S.papers.find(p => p.id === paperId);
  if (!paper) return false;
  const before = (paper.collections || []).length;
  paper.collections = (paper.collections || []).filter(id => id !== collectionId);
  return paper.collections.length !== before;
}

function refreshDuplicateModalAfterChange(message) {
  D.groups = findCollectionDuplicates(D.collectionId);
  save(); render();
  if (document.getElementById('dup-modal')?.classList.contains('open')) renderDuplicateModalBody();
  if (message) toast(message);
}

function resolveDuplicateGroup(groupIndex, keepId) {
  const group = D.groups[Number(groupIndex)];
  if (!group || !keepId) return;
  let removed = 0;
  group.papers.forEach(p => {
    if (p.id !== keepId && removePaperFromCollection(p.id, D.collectionId)) removed++;
  });
  refreshDuplicateModalAfterChange(t('{n} 件をコレクションから外しました', { n: removed }));
}

function removeDuplicateFromCollection(paperId) {
  if (!paperId || !D.collectionId) return;
  if (removePaperFromCollection(paperId, D.collectionId)) {
    refreshDuplicateModalAfterChange(t('1 件をコレクションから外しました'));
  }
}

/* ============================================================
   BIBTEX EXPORT
============================================================ */
function setBibOutput(content, filename='reference.bib', count=1) {
  lastModalTrigger = document.activeElement;
  const out = document.getElementById('bib-out');
  out.textContent = content;
  out.dataset.filename = filename;
  document.getElementById('bib-modal-title').textContent = t('BibTeX 出力（{n}件）', { n: count });
  document.getElementById('bib-modal').classList.add('open');
  document.querySelector('#bib-modal .modal-box')?.focus();
}
function showBib(id) {
  const p=S.papers.find(q=>q.id===id);
  if (!p) return;
  setBibOutput(genBib(p), `${sanitizeFilePart(p.bibtexKey || bKey(p) || 'reference')}.bib`, 1);
}
function showCollectionBib(collectionId) {
  const collection = S.collections.find(c => c.id === collectionId);
  if (!collection) return;
  const papers = S.papers.filter(p => (p.collections || []).includes(collectionId));
  if (!papers.length) {
    toast(t('このコレクションに文献がありません'));
    return;
  }
  const keys = papers.map(p => normalizeBibKey(p.bibtexKey || bKey(p)).toLowerCase());
  const duplicate = keys.find((key, index) => key && keys.indexOf(key) !== index);
  if (duplicate) {
    toast(t('Citation key「{key}」が重複しています', { key: duplicate }));
    return;
  }
  const sorted = [...papers].sort((a, b) =>
    normalizeBibKey(a.bibtexKey || bKey(a)).localeCompare(normalizeBibKey(b.bibtexKey || bKey(b)))
  );
  setBibOutput(sorted.map(genBib).join('\n'), `${sanitizeFilePart(collection.name || 'collection')}.bib`, sorted.length);
}

function copyCite(id) {
  const paper = S.papers.find(p => p.id === id);
  if (!paper) return;
  const command = `\\cite{${normalizeBibKey(paper.bibtexKey || bKey(paper))}}`;
  copyTextToClipboard(command, t('{command} をコピーしました', { command }));
}

function copyCollectionCite(collectionId) {
  const keys = S.papers
    .filter(p => (p.collections || []).includes(collectionId))
    .map(p => normalizeBibKey(p.bibtexKey || bKey(p)))
    .filter(Boolean);
  if (!keys.length) { toast(t('このコレクションに文献がありません')); return; }
  if (new Set(keys.map(key => key.toLowerCase())).size !== keys.length) {
    toast(t('Citation keyが重複しているためコピーできません'));
    return;
  }
  keys.sort((a, b) => a.localeCompare(b));
  const command = `\\cite{${keys.join(',')}}`;
  copyTextToClipboard(command, t('{n}件の引用コマンドをコピーしました', { n: keys.length }));
}

/* ============================================================
   AI-READY MARKDOWN EXPORT
============================================================ */
function mdScalar(value) {
  return JSON.stringify(String(value ?? ''));
}

function mdList(values) {
  return `[${(Array.isArray(values) ? values : []).map(v => mdScalar(v)).join(', ')}]`;
}

function paperMarkdown(p, index) {
  const title = plainText(p.title || '無題');
  const authors = (p.authors || []).map(plainText);
  const tags = (p.tags || []).map(plainText);
  const collections = (p.collections || [])
    .map(id => S.collections.find(c => c.id === id)?.name || id)
    .map(plainText);
  const links = [
    p.doi ? `https://doi.org/${String(p.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i, '')}` : '',
    p.url || '',
    p.arxivId ? `https://arxiv.org/abs/${p.arxivId}` : ''
  ].filter(Boolean);
  const sourceFiles = [
    p.pdfPath ? `PDF: ${p.pdfPath}` : '',
    ...(p.supplementalFiles || []).map(f => f.path ? `補足資料: ${f.path}` : `補足資料: ${f.name || 'あり'}`)
  ].filter(Boolean);
  const notes = String(p.notes || '').trim();
  const abstract = plainText(p.abstract || '').trim();
  const key = p.bibtexKey || bKey(p);
  const citation = p.citationCount != null ? p.citationCount : '不明';

  return [
    `## ${index}. ${title}`,
    '',
    '```yaml',
    `id: ${mdScalar(p.id)}`,
    `citation_key: ${mdScalar(key)}`,
    `title: ${mdScalar(title)}`,
    `authors: ${mdList(authors)}`,
    `year: ${p.year || ''}`,
    `journal: ${mdScalar(plainText(p.journal || ''))}`,
    `doi: ${mdScalar(p.doi || '')}`,
    `read_status: ${mdScalar(p.readStatus || 'unread')}`,
    `tags: ${mdList(tags)}`,
    `collections: ${mdList(collections)}`,
    `citation_count: ${citation}`,
    '```',
    '',
    links.length ? `**リンク:** ${links.map(link => `[${link}](${link})`).join(' · ')}` : '',
    sourceFiles.length ? `**ローカル資料:** ${sourceFiles.join(' / ')}` : '**ローカル資料:** なし',
    '',
    '### 要旨',
    abstract || '（要旨なし）',
    '',
    '### Bunkenメモ',
    notes || '（メモなし）',
    '',
    '### AI検索用の確認事項',
    '- この論文の主張・手法・条件・限界を分けて整理する。',
    '- 他の論文と一致する結果、相反する結果、未検証の点を抽出する。',
    '- 根拠が要旨だけの場合は、その旨を明記する。'
  ].filter((line, i, arr) => !(line === '' && arr[i - 1] === '' && arr[i + 1] === '')).join('\n');
}

function genCollectionMarkdown(collection, papers) {
  const sorted = [...papers].sort((a, b) => {
    const ay = Number(a.year) || 0;
    const by = Number(b.year) || 0;
    return by - ay || plainText(a.title || '').localeCompare(plainText(b.title || ''));
  });
  const tags = [...new Set(sorted.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b));
  const years = sorted.map(p => Number(p.year)).filter(Number.isFinite);
  const questions = [
    `「${collection.name}」の文献群から、主要な研究テーマを3〜5個に整理してください。`,
    '各論文について、研究目的・手法・条件・主要結果・限界を比較表にしてください。',
    '論文間で一致している知見と、相反している知見を分けてください。',
    'この文献群から見た未解決問題と、次に読むべき論文を提案してください。'
  ];
  return [
    '---',
    `name: ${mdScalar(collection.name)}`,
    `exported_at: ${mdScalar(new Date().toISOString())}`,
    `paper_count: ${sorted.length}`,
    `year_range: ${years.length ? `${Math.min(...years)}-${Math.max(...years)}` : '不明'}`,
    `tags: ${mdList(tags)}`,
    'purpose: "生成AIによる文献検索・比較・レビュー支援"',
    '---',
    '',
    `# ${plainText(collection.name)} — AI検索用文献パック`,
    '',
    '> このファイルはBunkenから出力した文献情報です。書誌情報・要旨・メモを根拠として扱い、本文未確認の内容は推測しないでください。',
    '',
    '## 使い方',
    '',
    '以下の文献情報を使って、文献検索・比較・研究課題の整理を行ってください。DOIやローカルPDFの参照先は原文確認用です。',
    '',
    '### 推奨プロンプト',
    ...questions.map(q => `- ${q}`),
    '',
    '## 文献一覧',
    '',
    ...sorted.map((p, i) => `- [${i + 1}. ${plainText(p.title || '無題')}](#${i + 1}-${plainText(p.title || '無題').toLowerCase().replace(/[^a-z0-9一-龠ぁ-んァ-ヶ]+/g, '-')})`),
    '',
    ...sorted.map((p, i) => paperMarkdown(p, i + 1))
  ].join('\n');
}

function setMarkdownOutput(content, filename) {
  lastModalTrigger = document.activeElement;
  const out = document.getElementById('markdown-out');
  out.textContent = content;
  out.dataset.filename = filename;
  document.getElementById('markdown-modal').classList.add('open');
  document.querySelector('#markdown-modal .modal-box')?.focus();
}

async function showCollectionMarkdown(collectionId) {
  const collection = S.collections.find(c => c.id === collectionId);
  if (!collection) return;
  const papers = S.papers.filter(p => (p.collections || []).includes(collectionId));
  if (!papers.length) {
    toast(t('このコレクションに文献がありません'));
    return;
  }
  const filename = `${sanitizeFilePart(collection.name || 'collection')}_ai-search.md`;
  const content = genCollectionMarkdown(collection, papers);
  setMarkdownOutput(content, filename);
  await saveMarkdownToStorage(content, filename, { notify: true });
}

async function copyTextToClipboard(content, successMessage = t('コピーしました')) {
  let fallbackTextarea = null;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(content);
    } else {
      fallbackTextarea = document.createElement('textarea');
      fallbackTextarea.value = content;
      fallbackTextarea.style.position = 'fixed';
      fallbackTextarea.style.opacity = '0';
      document.body.appendChild(fallbackTextarea);
      fallbackTextarea.select();
      if (!document.execCommand('copy')) throw new Error('copy command failed');
    }
    toast(successMessage);
    return true;
  } catch (error) {
    console.warn('clipboard copy failed', error);
    toast(t('コピーできませんでした。出力欄から手動でコピーしてください'));
    return false;
  } finally {
    fallbackTextarea?.remove();
  }
}

function cpMarkdown() {
  copyTextToClipboard(document.getElementById('markdown-out').textContent, t('Markdownをコピーしました'));
}

async function saveMarkdownToStorage(content, filename, { notify = false } = {}) {
  if (!(STORAGE_STATE.available && STORAGE_STATE.folderHandle)) return false;
  try {
    const ok = await ensureFolderPermission(STORAGE_STATE.folderHandle);
    if (!ok) throw new Error(t('保存先フォルダへの書き込み権限がありません'));
    const aiDir = await getOrCreateDirectory(STORAGE_STATE.folderHandle, 'ai-search');
    await writeBlobToFile(aiDir, filename, new Blob([content], { type: 'text/markdown;charset=utf-8' }));
    if (notify) toast(t('Markdownを更新しました: ai-search/{filename}', { filename }));
    return true;
  } catch (err) {
    console.warn('AI検索用Markdownの保存先フォルダへの書き込みに失敗しました', err);
    if (notify) toast(t('Markdownを保存できませんでした。保存先フォルダの権限を確認してください'));
    return false;
  }
}

async function dlMarkdown() {
  const out = document.getElementById('markdown-out');
  const filename = out.dataset.filename || 'collection_ai-search.md';
  const content = out.textContent || '';

  if (await saveMarkdownToStorage(content, filename, { notify: true })) {
    return;
  }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: 'text/markdown;charset=utf-8' }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function cpBib() {
  copyTextToClipboard(document.getElementById('bib-out').textContent, t('BibTeXをコピーしました'));
}
function dlBib() {
  const out = document.getElementById('bib-out');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out.textContent],{type:'application/x-bibtex;charset=utf-8'}));
  a.download=out.dataset.filename || 'reference.bib'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================
   EVENTS
============================================================ */
document.addEventListener('click', async (event) => {
  const actionEl = event.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const id = actionEl.dataset.id || '';
  const fileId = actionEl.dataset.fileId || '';
  const view = actionEl.dataset.view || '';
  const collectionId = actionEl.dataset.collectionId || '';
  const groupIndex = actionEl.dataset.group || '';
  const modal = actionEl.dataset.modal || '';
  const tab = actionEl.dataset.tab || '';
  const status = actionEl.dataset.status || '';
  try {
    switch (action) {
      case 'open-add-modal': openAddModal(); break;
      case 'close-modal': closeModal(modal); break;
      case 'switch-tab': switchTab(tab); break;
      case 'save-modal': await saveModal(); break;
      case 'copy-bib': cpBib(); break;
      case 'download-bib': dlBib(); break;
      case 'copy-markdown': cpMarkdown(); break;
      case 'download-markdown': await dlMarkdown(); break;
      case 'choose-storage-folder': await chooseStorageFolder(); break;
      case 'toggle-realtime-sync': await toggleRealtimeSync(); break;
      case 'import-from-folder': await importDataFromChosenFolderPrompt(); break;
      case 'sync-to-folder': await syncAllDataToChosenFolder(true); break;
      case 'clear-storage-folder': await clearStorageFolder(); break;
      case 'add-collection': addCollection(); break;
      case 'move-collection-up':
        event.stopPropagation();
        moveCollection(id, 'up');
        break;
      case 'move-collection-down':
        event.stopPropagation();
        moveCollection(id, 'down');
        break;
      case 'rename-collection':
        event.stopPropagation();
        renameCollection(id);
        break;
      case 'delete-collection':
        event.stopPropagation();
        deleteCollection(id);
        break;
      case 'set-view': setView(view); break;
      case 'set-lang': setLang(actionEl.dataset.lang); break;
      case 'select-paper': selectPaper(id); break;
      case 'toggle-star':
        event.stopPropagation();
        toggleStar(id);
        break;
      case 'toggle-abstract': toggleAbs(); break;
      case 'remove-tag': rmTagBtn(actionEl); break;
      case 'set-status': setStatus(id, status); break;
      case 'prompt-attach-pdf': promptAttachPdf(id); break;
      case 'open-pdf':
        event.preventDefault();
        await openStoredPdf(id);
        break;
      case 'remove-pdf': await removeAttachedPdf(id); break;
      case 'prompt-attach-supplement': promptAttachSupplement(id); break;
      case 'open-supplement':
        event.preventDefault();
        await openStoredSupplement(id, fileId);
        break;
      case 'remove-supplement':
        event.preventDefault();
        await removeSupplement(id, fileId);
        break;
      case 'open-edit-modal': openEditModal(id); break;
      case 'show-bib': showBib(id); break;
      case 'copy-cite': copyCite(id); break;
      case 'copy-collection-cite': copyCollectionCite(collectionId || (S.view.startsWith('col:') ? S.view.slice(4) : '')); break;
      case 'show-collection-bib': showCollectionBib(collectionId || (S.view.startsWith('col:') ? S.view.slice(4) : '')); break;
      case 'show-collection-markdown': await showCollectionMarkdown(collectionId || (S.view.startsWith('col:') ? S.view.slice(4) : '')); break;
      case 'show-collection-duplicates': openDuplicateModal(collectionId || (S.view.startsWith('col:') ? S.view.slice(4) : '')); break;
      case 'resolve-duplicate-group': resolveDuplicateGroup(groupIndex, id); break;
      case 'remove-duplicate-from-collection': removeDuplicateFromCollection(id); break;
      case 'delete-paper': await delPaper(id); break;
      case 'do-fetch': await doFetch(); break;
      case 'parse-bib': doParseBib(); break;
      case 'trigger-pdf-input': {
        const input = document.getElementById('pdf-in');
        if (input) input.click();
        break;
      }
    }
  } catch (err) {
    console.error(err);
  }
});

document.addEventListener('input', (event) => {
  if (event.target.id === 'srch') onSearch(event.target.value);
});

document.addEventListener('change', async (event) => {
  const target = event.target;
  if (target.id === 'fa') onFilter('author', target.value);
  else if (target.id === 'fy') onFilter('year', target.value);
  else if (target.id === 'fj') onFilter('journal', target.value);
  else if (target.id === 'sort') onSort(target.value);
  else if (target.id === 'pdf-attach-global') await handleExistingPaperPdf(target);
  else if (target.id === 'supp-attach-global') await handleExistingPaperSupplement(target);
  else if (target.id === 'pdf-in') await handlePDF(target.files && target.files[0]);
  else if (target.closest('[data-action="set-collection"]')) {
    const group = target.closest('[data-action="set-collection"]');
    setCol(group.dataset.id, Array.from(group.querySelectorAll('input[data-collection-id]:checked'), input => input.dataset.collectionId));
  }
  else if (target.dataset.action === 'notes-change') updNotes(target.dataset.id, target.value);
});

document.addEventListener('keydown', async (event) => {
  if (event.key==='Escape') document.querySelectorAll('.modal-ov.open').forEach(m=>closeModal(m.id));
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[role="button"][data-action]')) {
    event.preventDefault();
    event.target.click();
    return;
  }
  if (event.target.id === 'doi-in' && event.key === 'Enter') {
    event.preventDefault();
    await doFetch();
  }
  if (event.target.dataset.action === 'tag-input' && (event.key === 'Enter' || event.key === ',')) {
    addTag(event.target.dataset.id, event.target.value);
    event.target.value='';
    event.preventDefault();
  }
});

document.addEventListener('focusout', (event) => {
  if (event.target.dataset.action === 'tag-input' && event.target.value.trim()) {
    addTag(event.target.dataset.id, event.target.value);
    event.target.value='';
  }
});

document.addEventListener('dragover', (event) => {
  const drop = event.target.closest('#pdf-drop');
  if (!drop) return;
  event.preventDefault();
  drop.classList.add('dov');
});

document.addEventListener('dragleave', (event) => {
  const drop = event.target.closest('#pdf-drop');
  if (!drop) return;
  if (!drop.contains(event.relatedTarget)) drop.classList.remove('dov');
});

document.addEventListener('drop', async (event) => {
  const drop = event.target.closest('#pdf-drop');
  if (!drop) return;
  event.preventDefault();
  drop.classList.remove('dov');
  const file = event.dataTransfer?.files?.[0];
  if (file) await handlePDF(file);
});

document.querySelectorAll('.modal-ov').forEach(el => {
  el.addEventListener('click', e => { if(e.target===el) closeModal(el.id); });
});
/* ============================================================
   INIT
============================================================ */
load();
applyStaticI18n();
restoreSidebarWidth();
restoreListPaneWidth();
recomputeLocalDiff();
render();
initSidebarResize();
initListPaneResize();
restoreStorageFolder().then(() => renderSidebar()).catch(err => console.error(err));
</script>
