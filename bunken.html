<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bunken — 文献管理</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://api.crossref.org https://export.arxiv.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <style>
    /* ===== VARIABLES ===== */
    :root {
      --bg:         #FAF8F4;
      --bg-side:    #F0EDE6;
      --bg-hover:   #E8E4DC;
      --bg-sel:     #DDD8CE;
      --bg-card:    #FFFFFF;
      --text:       #1A1714;
      --text-2:     #6B6560;
      --text-m:     #9A948C;
      --accent:     #2B5797;
      --accent-lt:  #E8EFFC;
      --border:     #D8D4CC;
      --border-lt:  #E8E4DC;
      --star:       #C9820A;
      --c-unread:   #D94F30;
      --c-reading:  #1E8A5A;
      --tag-bg:     #E8EFFC;
      --tag-fg:     #2B5797;
      --shadow:     0 2px 10px rgba(0,0,0,0.08);
      --shadow-lg:  0 8px 40px rgba(0,0,0,0.14);
      --r:          6px;
      --r-sm:       4px;
      --ff:         system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ft:         'Georgia', 'Times New Roman', serif;
      --fm:         ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sidebar-w: 196px;
      --list-pane-w: 340px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #1A1714;
        --bg-side:    #141210;
        --bg-hover:   #252220;
        --bg-sel:     #2E2B28;
        --bg-card:    #252220;
        --text:       #EDE9E1;
        --text-2:     #9A948C;
        --text-m:     #6B6560;
        --accent:     #7EB8F7;
        --accent-lt:  #1A2A3A;
        --border:     #2E2B28;
        --border-lt:  #252220;
        --star:       #D4A017;
        --c-unread:   #F08070;
        --c-reading:  #5ABF8E;
        --tag-bg:     #1A2A3A;
        --tag-fg:     #7EB8F7;
        --shadow:     0 2px 10px rgba(0,0,0,0.35);
        --shadow-lg:  0 8px 40px rgba(0,0,0,0.50);
      }
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }
    button { font-family: var(--ff); }
    a { color: var(--accent); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-m); }

    /* ===== LAYOUT ===== */
    #app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: var(--sidebar-w); min-width: 140px; max-width: 420px;
      background: var(--bg-side);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto; overflow-x: hidden;
      flex-shrink: 0;
    }
    .sidebar-resizer, .list-pane-resizer {
      width: 7px; flex: 0 0 7px;
      cursor: col-resize;
      position: relative;
      background: transparent;
      z-index: 5;
      user-select: none;
      touch-action: none;
    }
    .sidebar-resizer::after, .list-pane-resizer::after {
      content: '';
      position: absolute; inset: 0 3px;
      background: transparent;
      transition: background .12s;
    }
    .sidebar-resizer:hover::after,
    body.sidebar-resizing .sidebar-resizer::after,
    .list-pane-resizer:hover::after,
    body.list-pane-resizing .list-pane-resizer::after { background: var(--accent); }
    body.sidebar-resizing, body.list-pane-resizing { cursor: col-resize; user-select: none; }
    .list-pane {
      width: var(--list-pane-w); min-width: 240px; max-width: 720px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
    }
    .detail-pane { flex: 1; overflow-y: auto; }

    /* ===== SIDEBAR ===== */
    .side-logo {
      padding: 14px 14px 10px;
      font-family: var(--ft);
      font-size: 19px; font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid var(--border-lt);
      letter-spacing: -0.2px;
    }
    .side-logo span { color: var(--accent); }

    .side-sec { padding: 8px 0; border-bottom: 1px solid var(--border-lt); }

    .side-sec-hd {
      padding: 2px 14px 5px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.9px; text-transform: uppercase;
      color: var(--text-m);
      display: flex; align-items: center;
    }
    .side-sec-hd button {
      margin-left: auto;
      background: none; border: none; cursor: pointer;
      color: var(--text-m); font-size: 15px; line-height: 1;
      padding: 0 2px; border-radius: 3px;
      transition: color .1s;
    }
    .side-sec-hd button:hover { color: var(--accent); }

    .side-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 14px; cursor: pointer;
      font-size: 13px; color: var(--text-2);
      transition: background .1s, color .1s;
      user-select: none;
    }
    .side-item:hover { background: var(--bg-hover); color: var(--text); }
    .side-item.active { background: var(--bg-sel); color: var(--text); font-weight: 500; }
    .side-item .ico { font-size: 12px; flex-shrink: 0; opacity: .8; }
    .side-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-item .cnt {
      margin-left: auto; flex-shrink: 0;
      font-size: 10px; color: var(--text-m);
      background: var(--bg-hover);
      padding: 0 5px; border-radius: 9px; min-width: 18px; text-align: center;
    }
    .side-item.active .cnt { background: var(--bg); }
    .side-item .side-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .side-item .side-actions .cnt { margin-left: 0; }
    .side-item .side-act {
      background: none; border: none; cursor: pointer;
      color: var(--text-m); font-size: 11px; line-height: 1;
      padding: 1px 3px; border-radius: 3px; flex-shrink: 0;
      transition: background .1s, color .1s;
    }
    .side-item .side-act:hover { background: var(--bg); color: var(--text); }
    .side-item .side-act:disabled {
      opacity: .35; cursor: default; pointer-events: none;
    }
    .side-item.active .side-act:hover { background: var(--bg-hover); }

    .side-empty { padding: 3px 14px 5px; font-size: 11px; color: var(--text-m); }
    .side-btn-row { display:block; margin-top:6px; }
    .diff-chip {
      display:inline-flex; align-items:center; justify-content:center;
      min-width: 40px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      color: var(--text-2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .side-btn-flex {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .side-btn-label { min-width: 0; }
    .diff-chip.diff-remote { color: var(--accent); border-color: var(--accent); background: var(--accent-lt); }
    .diff-chip.diff-local { color: var(--c-reading); border-color: var(--c-reading); background: #DFF5EC; }
    @media (prefers-color-scheme: dark) {
      .diff-chip.diff-local { background: #112A1E; }
    }
    .side-storage { padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
    .side-storage-name { font-size: 12px; color: var(--text-2); line-height: 1.4; word-break: break-word; }
    .side-storage-status { font-size: 11px; color: var(--text-m); line-height: 1.4; }
    .side-btn {
      width: 100%; text-align: left;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 6px 8px;
      color: var(--text-2); font-size: 12px; cursor: pointer;
      transition: background .1s, color .1s, border-color .1s;
    }
    .side-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--text-m); }

    .side-lang { margin-top: auto; position: sticky; bottom: 0; background: var(--bg-side); border-bottom: none; border-top: 1px solid var(--border); }
    .lang-switch { display: flex; gap: 6px; padding: 4px 14px 8px; }
    .lang-switch button {
      flex: 1; padding: 5px 6px; font-size: 12px; cursor: pointer;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-2);
      transition: background .1s, color .1s, border-color .1s;
    }
    .lang-switch button:hover { background: var(--bg-hover); color: var(--text); }
    .lang-switch button.on { background: var(--accent-lt); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* ===== LIST PANE ===== */
    .list-hd {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .list-hd-top {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .list-tools { display: none; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .list-tools.on { display: flex; }
    .list-title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-add {
      display: flex; align-items: center; gap: 4px;
      background: var(--accent); color: white;
      border: none; padding: 5px 10px;
      border-radius: var(--r-sm);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: opacity .15s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-add:hover { opacity: .85; }

    .search-wrap { position: relative; margin-bottom: 6px; }
    .search-wrap .si { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-m); pointer-events: none; }
    .search-wrap input {
      width: 100%; background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 5px 8px 5px 24px;
      font-size: 12px; font-family: var(--ff); color: var(--text); outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text-m); }

    .filter-row { display: flex; gap: 4px; }
    .filter-row select {
      flex: 1; min-width: 0;
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 3px 5px;
      font-size: 11px; font-family: var(--ff); color: var(--text-2); outline: none; cursor: pointer;
    }
    .filter-row select:focus { border-color: var(--accent); }

    .paper-list { flex: 1; overflow-y: auto; }

    .paper-item {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-lt);
      cursor: pointer;
      transition: background .1s;
    }
    .paper-item:hover { background: var(--bg-hover); }
    .paper-item.sel { background: var(--bg-sel); }
    .paper-item:focus-visible, .side-item:focus-visible,
    button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent); outline-offset: -2px;
    }

    .pi-top { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; }
    .pi-star {
      background: none; border: none; cursor: pointer;
      font-size: 12px; padding: 0; line-height: 1;
      color: var(--text-m); transition: color .1s; flex-shrink: 0; margin-top: 1px;
    }
    .pi-star:hover, .pi-star.on { color: var(--star); }
    .pi-title {
      flex: 1; font-size: 13px; font-weight: 500; color: var(--text);
      line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pi-year { font-size: 11px; color: var(--text-m); flex-shrink: 0; margin-top: 1px; }
    .pi-meta { font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 5px; }
    .pi-bot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 9px; font-weight: 500;
    }
    .badge.unread   { background: #FEE8E2; color: var(--c-unread); }
    .badge.reading  { background: #DFF5EC; color: var(--c-reading); }
    .badge.read     { background: var(--bg-hover); color: var(--text-m); }
    @media (prefers-color-scheme: dark) {
      .badge.unread  { background: #3A1A14; }
      .badge.reading { background: #112A1E; }
    }
    .tag-pill {
      font-size: 10px; padding: 1px 7px; border-radius: 9px;
      background: var(--tag-bg); color: var(--tag-fg);
    }
    .pi-cit { font-size: 10px; color: var(--text-m); margin-left: auto; }

    .empty-list {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 8px; color: var(--text-m); font-size: 13px;
      padding: 40px 20px; text-align: center;
    }
    .empty-list .ei { font-size: 30px; margin-bottom: 4px; }

    /* ===== DETAIL PANE ===== */
    .detail-ph {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--text-m); font-size: 13px; gap: 8px;
    }
    .detail-ph .phi { font-size: 38px; margin-bottom: 4px; }

    .detail-wrap { padding: 26px 30px; max-width: 820px; }

    .d-star {
      background: none; border: none; cursor: pointer;
      font-size: 22px; padding: 0; margin-bottom: 10px; display: block;
      color: var(--text-m); transition: transform .15s, color .15s;
    }
    .d-star:hover { transform: scale(1.15); }
    .d-star.on { color: var(--star); }

    .d-type {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
    }
    .d-title {
      font-family: var(--ft); font-size: 22px; font-weight: 600;
      line-height: 1.3; color: var(--text); margin-bottom: 8px;
    }
    .d-authors { font-size: 14px; color: var(--text-2); margin-bottom: 3px; }
    .d-venue { font-size: 13px; color: var(--text-m); margin-bottom: 12px; }
    .d-links { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
    .d-link {
      font-size: 11px; padding: 3px 10px; border-radius: 12px;
      border: 1px solid var(--border); color: var(--accent);
      text-decoration: none; font-weight: 500; transition: background .1s;
    }
    .d-link:hover { background: var(--accent-lt); }
    button.d-link { background: none; cursor: pointer; font-family: var(--ff); }
    .d-cit {
      font-size: 12px; color: var(--text-2); margin-bottom: 12px;
      display: flex; align-items: baseline; gap: 5px;
    }
    .d-cit strong { font-size: 18px; font-weight: 600; color: var(--text); }
    .cite-key {
      display: inline-flex; align-items: center; gap: 7px;
      margin: 0 0 12px; padding: 4px 9px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: var(--bg-hover); color: var(--text-2);
      font-family: var(--fm); font-size: 11px;
    }

    .d-div { border: none; border-top: 1px solid var(--border-lt); margin: 14px 0; }
    .d-sh {
      font-size: 10px; font-weight: 600; letter-spacing: .8px;
      text-transform: uppercase; color: var(--text-m); margin-bottom: 7px;
    }

    .d-abstract { font-size: 13.5px; color: var(--text-2); line-height: 1.7; }
    .d-abstract.coll {
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .expand-btn {
      background: none; border: none; cursor: pointer;
      color: var(--accent); font-size: 11.5px; font-family: var(--ff);
      padding: 4px 0; text-decoration: underline;
    }

    .tags-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag-edit {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; padding: 2px 6px 2px 8px;
      border-radius: 9px; background: var(--tag-bg); color: var(--tag-fg);
    }
    .tag-edit button {
      background: none; border: none; cursor: pointer;
      color: var(--tag-fg); opacity: .5; font-size: 11px;
      padding: 0; line-height: 1; transition: opacity .1s;
    }
    .tag-edit button:hover { opacity: 1; }
    .tag-in {
      font-size: 12px; font-family: var(--ff);
      background: none; border: 1px dashed var(--border);
      border-radius: 9px; padding: 2px 9px;
      color: var(--text); outline: none; width: 110px;
    }
    .tag-in:focus { border-color: var(--accent); }

    .status-row { display: flex; gap: 6px; }
    .s-btn {
      font-size: 11px; padding: 4px 10px; border-radius: 12px;
      border: 1px solid var(--border); background: none;
      color: var(--text-2); cursor: pointer; font-family: var(--ff);
      transition: all .1s;
    }
    .s-btn:hover { border-color: var(--text-m); color: var(--text); }
    .s-btn.on-unread   { background: #FEE8E2; color: var(--c-unread);  border-color: var(--c-unread);  font-weight: 500; }
    .s-btn.on-reading  { background: #DFF5EC; color: var(--c-reading); border-color: var(--c-reading); font-weight: 500; }
    .s-btn.on-read     { background: var(--bg-hover); color: var(--text); border-color: var(--border); font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      .s-btn.on-unread  { background: #3A1A14; }
      .s-btn.on-reading { background: #112A1E; }
    }

    .col-checks {
      display: flex; flex-direction: column; gap: 5px;
      min-width: 190px; max-height: 180px; overflow-y: auto;
      padding: 7px 9px; background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--r-sm);
    }
    .col-check {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--text); cursor: pointer;
    }
    .col-check input { margin: 0; accent-color: var(--accent); cursor: pointer; }

    .notes-ta {
      width: 100%; background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 10px 12px; font-size: 13px; font-family: var(--ff);
      color: var(--text); resize: vertical; min-height: 80px;
      outline: none; line-height: 1.5;
    }
    .notes-ta:focus { border-color: var(--accent); }

    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sec {
      display: flex; align-items: center; gap: 5px;
      background: none; border: 1px solid var(--border);
      padding: 6px 12px; border-radius: var(--r-sm);
      font-size: 12px; color: var(--text-2); cursor: pointer; transition: all .1s;
    }
    .btn-sec:hover { background: var(--bg-hover); color: var(--text); }
    .btn-del {
      background: none; border: 1px solid var(--c-unread);
      padding: 6px 12px; border-radius: var(--r-sm);
      font-size: 12px; color: var(--c-unread); cursor: pointer; transition: all .1s;
    }
    .btn-del:hover { background: #FEE8E2; }
    @media (prefers-color-scheme: dark) { .btn-del:hover { background: #3A1A14; } }

    /* ===== MODAL ===== */
    .modal-ov {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    @media (prefers-color-scheme: dark) { .modal-ov { background: rgba(0,0,0,.60); } }
    .modal-ov.open { display: flex; }

    .modal-box {
      background: var(--bg-card); border-radius: 10px;
      box-shadow: var(--shadow-lg);
      width: 620px; max-width: 95vw; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
      animation: mUp .22s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes mUp { from { opacity:0; transform: translateY(14px) scale(.97); } to { opacity:1; transform: none; } }

    .modal-hd {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-hd-title { font-size: 15px; font-weight: 600; }
    .modal-x {
      background: none; border: none; cursor: pointer;
      color: var(--text-m); font-size: 17px; padding: 2px 6px;
      border-radius: 4px; line-height: 1; transition: color .1s;
    }
    .modal-x:hover { color: var(--text); }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-hover);
      padding: 0 20px;
      flex-shrink: 0;
    }
    .m-tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 9px 13px; margin-bottom: -1px;
      font-size: 12px; font-family: var(--ff); font-weight: 500;
      color: var(--text-m); cursor: pointer; transition: all .1s;
    }
    .m-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .m-tab:hover:not(.on) { color: var(--text); }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    .modal-ft {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
      flex-shrink: 0;
    }

    /* Form elements */
    .fg { margin-bottom: 13px; }
    .fl {
      display: block; font-size: 10px; font-weight: 600;
      letter-spacing: .6px; text-transform: uppercase;
      color: var(--text-m); margin-bottom: 4px;
    }
    .fi, .fta, .fsel {
      width: 100%;
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 10px;
      font-size: 13px; font-family: var(--ff); color: var(--text);
      outline: none; transition: border-color .1s;
    }
    .fi:focus, .fta:focus, .fsel:focus { border-color: var(--accent); }
    .fi::placeholder, .fta::placeholder { color: var(--text-m); }
    .fta { resize: vertical; min-height: 80px; line-height: 1.5; }
    .frow { display: flex; gap: 10px; }
    .frow .fg { flex: 1; min-width: 0; }
    .form-details { margin: 4px 0 13px; }
    .form-details summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
    .form-details-body { padding-top: 12px; }

    .fetch-row { display: flex; gap: 8px; }
    .fetch-row .fi { flex: 1; }
    .btn-fetch {
      display: flex; align-items: center; gap: 5px;
      background: var(--accent); color: white; border: none;
      padding: 7px 14px; border-radius: var(--r-sm);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: opacity .15s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-fetch:hover { opacity: .85; }
    .btn-fetch:disabled { opacity: .4; cursor: not-allowed; }

    .fs { font-size: 12px; padding: 5px 0; min-height: 22px; color: var(--text-2); }
    .fs.ok { color: var(--c-reading); }
    .fs.err { color: var(--c-unread); }

    .preview {
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--r); padding: 11px 13px;
      font-size: 12px; color: var(--text-2);
      display: none; margin-top: 8px; line-height: 1.5;
    }
    .preview.on { display: block; }
    .preview strong { display: block; font-size: 13px; color: var(--text); margin-bottom: 3px; }

    .bta {
      width: 100%; background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 10px; font-size: 12px; font-family: var(--fm);
      color: var(--text); outline: none; resize: vertical;
      min-height: 160px; line-height: 1.5;
    }
    .bta:focus { border-color: var(--accent); }

    .drop-area {
      border: 2px dashed var(--border); border-radius: var(--r);
      padding: 34px 20px; text-align: center; cursor: pointer;
      color: var(--text-m); font-size: 13px; transition: all .15s;
    }
    .drop-area:hover, .drop-area.dov { border-color: var(--accent); background: var(--accent-lt); color: var(--accent); }
    .drop-area .di { font-size: 28px; display: block; margin-bottom: 8px; }

    .bib-out {
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px;
      font-family: var(--fm); font-size: 12px; color: var(--text);
      white-space: pre; overflow-x: auto; line-height: 1.65;
      max-height: 450px; overflow-y: auto;
    }
    .dup-summary { font-size: 12px; color: var(--text-2); margin-bottom: 12px; line-height: 1.6; }
    .dup-list { display: flex; flex-direction: column; gap: 12px; }
    .dup-group {
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--bg-card);
      overflow: hidden;
    }
    .dup-key {
      padding: 8px 10px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600;
      color: var(--text-2);
    }
    .dup-paper {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--border-lt);
    }
    .dup-paper:last-child { border-bottom: none; }
    .dup-paper-main { flex: 1; min-width: 0; }
    .dup-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .dup-meta { font-size: 11px; color: var(--text-m); margin-top: 3px; line-height: 1.5; }
    .dup-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .dup-empty { text-align: center; padding: 28px 10px; color: var(--text-m); font-size: 13px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text); color: var(--bg);
      padding: 9px 16px; border-radius: var(--r);
      font-size: 13px; z-index: 200;
      opacity: 0; transform: translateY(8px);
      transition: all .2s; pointer-events: none;
    }
    .toast.on { opacity: 1; transform: none; }

    /* Spinner */
    .spin {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 50%; animation: rot .6s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }

  </style>
</head>

const PDFJS_MODULE_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs';
const PDFJS_WORKER_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs';
const SIDEBAR_WIDTH_KEY = 'bunken_sidebar_width';
const SIDEBAR_MIN_WIDTH = 140;

const LIST_PANE_DEFAULT_WIDTH = 340;
let pdfjsModulePromise = null;

async function getPdfJsLib() {
  if (!pdfjsModulePromise) {
    pdfjsModulePromise = import(PDFJS_MODULE_URL).then(mod => {
      const lib = mod.default || mod;
      lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
      return lib;
    }).catch(err => {
      pdfjsModulePromise = null;
      throw err;
    });
  }
  return pdfjsModulePromise;
}

function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'ja' || saved === 'en') return saved;
  } catch (_) {}
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ja';
  return /^ja/i.test(nav) ? 'ja' : 'en';
}
let LANG = detectLang();
function t(key, vars) {
  let s = (LANG === 'en' && Object.prototype.hasOwnProperty.call(I18N_EN, key)) ? I18N_EN[key] : key;
  if (vars && LANG === 'en') s = s.replace(/\{(\w+)\}(\s+(?:[A-Za-z]+\s+)?[A-Za-z]+)\(s\)/g, (m, k, w) => (Object.prototype.hasOwnProperty.call(vars, k) ? ('{' + k + '}' + (Number(vars[k]) === 1 ? w : w + 's')) : m));
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(vars, k) ? vars[k] : m));
  return s;
}
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.title = t('bunken — 文献管理');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  ['title', 'placeholder', 'aria-label'].forEach(attr => {
    document.querySelectorAll('[data-i18n-' + attr + ']').forEach(el => {
      el.setAttribute(attr, t(el.getAttribute('data-i18n-' + attr)));
    });
  });
}
function setLang(lang) {
  if (lang !== 'ja' && lang !== 'en') return;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
  applyStaticI18n();
  render();
}

const SAFE_PAPER_TYPES = new Set(['article', 'inproceedings', 'preprint', 'book', 'misc', 'phdthesis', 'mastersthesis']);
const SAFE_READ_STATUS = new Set(['unread', 'reading', 'read']);
const SAFE_URL_PROTOCOLS = new Set(['https:', 'http:']);

function sanitizeText(value, maxLen = 5000) {
  if (value == null) return '';
  return String(value).replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, maxLen);
}

function sanitizeId(value) {
  const cleaned = sanitizeText(value, 120).replace(/[^A-Za-z0-9:_-]/g, '');
  return cleaned || uid();
}

function normalizeYear(value) {
  const n = parseInt(value, 10);
  return Number.isInteger(n) && n >= 1000 && n <= 3000 ? n : null;
}

function normalizeCount(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? Math.trunc(n) : null;
}

function normalizeType(value) {
  return SAFE_PAPER_TYPES.has(value) ? value : 'article';
}

function normalizeReadStatus(value) {
  return SAFE_READ_STATUS.has(value) ? value : 'unread';
}

function sanitizeStringArray(values, maxItems = 50, maxLen = 160) {
  if (!Array.isArray(values)) return [];
  const seen = new Set();
  const out = [];
  for (const value of values) {
    const item = sanitizeText(value, maxLen);
    if (!item || seen.has(item)) continue;
    seen.add(item);
    out.push(item);
    if (out.length >= maxItems) break;
  }
  return out;
}

function sanitizeExternalUrl(raw) {
  const value = sanitizeText(raw, 2048);
  if (!value) return '';
  try {
    const url = new URL(value, window.location.href);
    if (!SAFE_URL_PROTOCOLS.has(url.protocol)) return '';
    return url.href;
  } catch (_) {
    return '';
  }
}

function sanitizeRelativePath(raw) {
  const value = sanitizeText(raw, 240).replace(/\\/g, '/').trim();
  if (!value || value.startsWith('/')) return '';
  const parts = value.split('/').filter(Boolean);
  if (!parts.length) return '';
  for (const part of parts) {
    if (part === '.' || part === '..') return '';
    if (/[\u0000-\u001f\u007f]/.test(part)) return '';
  }
  return parts.join('/');
}

function normalizeCollection(value) {
  return {
    id: sanitizeId(value?.id),
    name: sanitizeText(value?.name, 80) || 'Untitled'
  };
}

function normalizePaper(p) {
  const safeId = sanitizeId(p?.id);
  const safePdfId = p?.pdfId ? sanitizeId(p.pdfId) : safeId;
  return {
    id: safeId,
    type: normalizeType(p?.type),
    bibtexKey: normalizeBibKey(p?.bibtexKey),
    title: sanitizeText(cleanBibText(p?.title, true, { symbolFix: true }), 500),
    authors: sanitizeStringArray((Array.isArray(p?.authors) ? p.authors : []).map(a => cleanBibText(a)), 40, 160),
    year: normalizeYear(p?.year),
    journal: sanitizeText(cleanBibText(p?.journal), 240),
    booktitle: sanitizeText(cleanBibText(p?.booktitle), 240),
    volume: sanitizeText(cleanBibText(p?.volume), 40),
    number: sanitizeText(cleanBibText(p?.number), 40),
    pages: sanitizeText(cleanBibText(p?.pages), 60),
    publisher: sanitizeText(cleanBibText(p?.publisher), 240),
    school: sanitizeText(cleanBibText(p?.school), 240),
    doi: normalizeDoi(p?.doi),
    arxivId: normalizeArxivId(p?.arxivId),
    archivePrefix: sanitizeText(p?.archivePrefix, 40),
    primaryClass: sanitizeText(p?.primaryClass, 80),
    url: sanitizeExternalUrl(p?.url),
    abstract: sanitizeText(cleanBibText(p?.abstract, false, { abstract: true, symbolFix: true }), 12000),
    citationCount: normalizeCount(p?.citationCount),
    tags: sanitizeStringArray(Array.isArray(p?.tags) ? p.tags : [], 60, 40),
    collections: sanitizeStringArray(Array.isArray(p?.collections) ? p.collections : [], 10, 120),
    starred: !!p?.starred,
    readStatus: normalizeReadStatus(p?.readStatus),
    notes: sanitizeText(p?.notes, 12000),
    addedAt: sanitizeText(p?.addedAt, 40) || new Date().toISOString(),
    pdfId: safePdfId,
    pdfName: sanitizeText(p?.pdfName, 200),
    pdfOriginalName: sanitizeText(p?.pdfOriginalName, 200),
    pdfPath: sanitizeRelativePath(p?.pdfPath),
    hasPdf: !!p?.hasPdf,
    supplementalFiles: Array.isArray(p?.supplementalFiles)
      ? p.supplementalFiles.slice(0, 50).map((f, idx) => ({
          id: sanitizeId(f?.id),
          name: sanitizeText(f?.name, 200),
          originalName: sanitizeText(f?.originalName || f?.name, 200),
          path: sanitizeRelativePath(f?.path),
          type: sanitizeText(f?.type, 120) || 'application/octet-stream',
          size: Math.max(0, Number(f?.size) || 0),
          updatedAt: sanitizeText(f?.updatedAt, 40) || new Date().toISOString(),
          slot: Number.isFinite(f?.slot) ? f.slot : (idx + 1)
        }))
      : []
  };
}

function load() {
  let raw = '';
  try {
    raw = localStorage.getItem('bunken_v1') || '';
    if (raw) { const p = JSON.parse(raw); S.papers = (p.papers||[]).map(normalizePaper); S.collections = Array.isArray(p.collections) ? p.collections.map(normalizeCollection) : []; }
  } catch(e) {
    console.error('library load failed', e);
    try { if (raw) localStorage.setItem(`bunken_v1_corrupt_${Date.now()}`, raw); } catch (_) {}
    toast(t('ライブラリを読み込めませんでした。破損データはブラウザ内に退避しました'));
  }
}
function save() {
  try { localStorage.setItem('bunken_v1', JSON.stringify({ papers: S.papers, collections: S.collections })); }
  catch(e) { if (e.name === 'QuotaExceededError') toast(t('⚠ ストレージが上限に近づいています')); }
  recomputeLocalDiff();
  if (document.getElementById('sidebar')) renderSidebar();
  if (!STORAGE_STATE.syncSuspended) scheduleFolderSync();
}


const PDF_DB_NAME = 'bunken_pdf_db';
const PDF_STORE = 'pdfs';
const MATERIAL_STORE = 'materials';
const SETTINGS_STORE = 'settings';
let pdfDbPromise = null;

function openPdfDb() {
  if (!('indexedDB' in window)) return Promise.reject(new Error(t('このブラウザは IndexedDB に対応していません')));
  if (pdfDbPromise) return pdfDbPromise;
  pdfDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(PDF_DB_NAME, 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PDF_STORE)) db.createObjectStore(PDF_STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(MATERIAL_STORE)) db.createObjectStore(MATERIAL_STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(SETTINGS_STORE)) db.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error(t('IndexedDB を開けませんでした')));
  });
  return pdfDbPromise;
}

async function putPdfBlob(id, file) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PDF_STORE, 'readwrite');
    tx.objectStore(PDF_STORE).put({
      id,
      name: file.name,
      type: file.type || 'application/pdf',
      updatedAt: new Date().toISOString(),
      blob: file
    });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error(t('PDF の保存に失敗しました')));
  });
}

async function getPdfBlob(id) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PDF_STORE, 'readonly');
    const req = tx.objectStore(PDF_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error(t('PDF の読み込みに失敗しました')));
  });
}

  const db = await openPdfDb();

async function ensureFolderPermission(handle, { request = true } = {}) {

function canonicalizeLibraryData(data) {
  const papers = (Array.isArray(data?.papers) ? data.papers : []).map(normalizePaper).map(p => ({
    ...p,
    authors: [...(p.authors || [])],
    tags: [...(p.tags || [])],
    collections: [...(p.collections || [])].sort(),
    supplementalFiles: [...(p.supplementalFiles || [])]
      .map((f, idx) => ({
        id: f.id || '',
        name: f.name || '',
        originalName: f.originalName || '',
        path: f.path || '',
        type: f.type || 'application/octet-stream',
        size: f.size || 0,
        updatedAt: f.updatedAt || '',
        slot: Number.isFinite(f.slot) ? f.slot : (idx + 1)
      }))
      .sort((a, b) => String(a.id).localeCompare(String(b.id)))
  })).sort((a, b) => String(a.id).localeCompare(String(b.id)));

  const collections = (Array.isArray(data?.collections) ? data.collections : [])
    .map(c => ({ id: c.id || '', name: c.name || '' }))
    .sort((a, b) => String(a.id).localeCompare(String(b.id)));

  return { papers, collections };
}

function getCurrentLibraryData() {
  return canonicalizeLibraryData({ papers: S.papers, collections: S.collections });
}

function stableFingerprint(data) {
  return JSON.stringify(canonicalizeLibraryData(data));
}

function mapById(arr) {
  const m = new Map();
  (arr || []).forEach(item => m.set(String(item.id || ''), item));
  return m;
}

function computeLibraryDiff(baseData, otherData) {
  const base = canonicalizeLibraryData(baseData || {});
  const other = canonicalizeLibraryData(otherData || {});
  const basePapers = mapById(base.papers);
  const otherPapers = mapById(other.papers);
  const baseCollections = mapById(base.collections);
  const otherCollections = mapById(other.collections);

  let added = 0, removed = 0, modified = 0;

  for (const [id, paper] of otherPapers) {
    if (!basePapers.has(id)) added++;
    else if (JSON.stringify(basePapers.get(id)) !== JSON.stringify(paper)) modified++;
  }
  for (const id of basePapers.keys()) {
    if (!otherPapers.has(id)) removed++;
  }
  for (const [id, col] of otherCollections) {
    if (!baseCollections.has(id)) added++;
    else if (JSON.stringify(baseCollections.get(id)) !== JSON.stringify(col)) modified++;
  }
  for (const id of baseCollections.keys()) {
    if (!otherCollections.has(id)) removed++;
  }

  return { added, removed, modified };
}

function diffHasChanges(diff) {
  return !!(diff && (diff.added || diff.removed || diff.modified));
}

function formatDiffBadge(diff) {
  if (!diffHasChanges(diff)) return '';
  const parts = [];
  if (diff.added) parts.push('+' + diff.added);
  if (diff.removed) parts.push('-' + diff.removed);
  if (diff.modified) parts.push('~' + diff.modified);
  return parts.join('/');
}

function setSyncBaseline(data) {
  STORAGE_STATE.syncBaseline = canonicalizeLibraryData(data || {});
  STORAGE_STATE.localDiff = { added: 0, removed: 0, modified: 0 };
  STORAGE_STATE.remoteDiff = { added: 0, removed: 0, modified: 0 };
  putSetting('syncBaseline', STORAGE_STATE.syncBaseline).catch(err => console.warn('sync baseline save failed', err));
}

function recomputeLocalDiff() {
  if (!STORAGE_STATE.syncBaseline) {
    STORAGE_STATE.localDiff = { added: 0, removed: 0, modified: 0 };
    return STORAGE_STATE.localDiff;
  }
  STORAGE_STATE.localDiff = computeLibraryDiff(STORAGE_STATE.syncBaseline, getCurrentLibraryData());
  return STORAGE_STATE.localDiff;
}

async function refreshRemoteDiff() {
  if (!STORAGE_STATE.folderHandle || !STORAGE_STATE.syncBaseline) {
    STORAGE_STATE.remoteDiff = { added: 0, removed: 0, modified: 0 };
    if (document.getElementById('sidebar')) renderSidebar();
    return STORAGE_STATE.remoteDiff;
  }
  if (STORAGE_STATE.remoteScanInFlight) return STORAGE_STATE.remoteScanInFlight;

  STORAGE_STATE.remoteScanInFlight = (async () => {
    try {
      const ok = await ensureFolderPermission(STORAGE_STATE.folderHandle, { request: false });
      if (!ok) throw new Error(t('保存先フォルダへのアクセス権限がありません'));
      let remoteData = { papers: [], collections: [] };
      try {
        remoteData = await readJsonFile(STORAGE_STATE.folderHandle, 'bunken-library.json');
      } catch (e) {
        STORAGE_STATE.remoteDiff = computeLibraryDiff(STORAGE_STATE.syncBaseline, remoteData);
        return STORAGE_STATE.remoteDiff;
      }
      const fp = stableFingerprint(remoteData);
      STORAGE_STATE.remoteLastSeenFingerprint = fp;
      STORAGE_STATE.remoteLastSeenSavedAt = remoteData.savedAt || '';
      STORAGE_STATE.remoteDiff = computeLibraryDiff(STORAGE_STATE.syncBaseline, remoteData);
      return STORAGE_STATE.remoteDiff;
    } catch (e) {
      console.warn('remote diff refresh skipped', e);
      return STORAGE_STATE.remoteDiff;
    } finally {
      STORAGE_STATE.remoteScanInFlight = null;
      if (document.getElementById('sidebar')) renderSidebar();
    }
  })();

  return STORAGE_STATE.remoteScanInFlight;
}

function startRemoteWatch() {
  stopRemoteWatch();
  if (!STORAGE_STATE.folderHandle || !STORAGE_STATE.realtimeSync) return;
  refreshRemoteDiff().catch(err => console.warn(err));
  STORAGE_STATE.remoteWatchTimer = setInterval(() => {
    refreshRemoteDiff().catch(err => console.warn(err));
  }, 8000);
}

function stopRemoteWatch() {
  if (STORAGE_STATE.remoteWatchTimer) clearInterval(STORAGE_STATE.remoteWatchTimer);
  STORAGE_STATE.remoteWatchTimer = null;
}

async function restoreStorageFolder() {
  if (!STORAGE_STATE.available) {
    STORAGE_STATE.status = 'unsupported';
    return;
  }
  try {
    const handle = await getSetting('storageFolderHandle');
    const folderName = await getSetting('storageFolderName');
    const lastSyncedAt = await getSetting('lastSyncedAt');
    const syncBaseline = await getSetting('syncBaseline');
    const realtimeSync = await getSetting('realtimeSync');
    STORAGE_STATE.realtimeSync = realtimeSync !== false;
    STORAGE_STATE.folderHandle = handle || null;
    STORAGE_STATE.syncBaseline = syncBaseline ? canonicalizeLibraryData(syncBaseline) : null;
    // older versions stored the translated placeholder ("選択済みフォルダ" / "Selected folder") as the name
    const PLACEHOLDER_NAMES = ['\u9078\u629e\u6e08\u307f\u30d5\u30a9\u30eb\u30c0', I18N_EN['\u9078\u629e\u6e08\u307f\u30d5\u30a9\u30eb\u30c0']];
    STORAGE_STATE.folderName = (folderName && !PLACEHOLDER_NAMES.includes(folderName) ? folderName : '') || (handle && handle.name) || '';
    STORAGE_STATE.lastSyncedAt = lastSyncedAt || '';
    STORAGE_STATE.status = handle ? 'folder' : 'browser';
    recomputeLocalDiff();

    if (handle && STORAGE_STATE.realtimeSync) {
      try {
        const ok = await ensureFolderPermission(handle, { request: false });
        if (ok) {
          let hasRemoteLibrary = false;
          try {
            await handle.getFileHandle('bunken-library.json');
            hasRemoteLibrary = true;
          } catch (_) {}
          if (hasRemoteLibrary) {
            if (diffHasChanges(STORAGE_STATE.localDiff)) {
              toast(t('未同期のブラウザ内変更があるため、保存先の自動読み込みを停止しました'));
            } else {
              await importDataFromFolder(handle, { replaceExisting: true, showToast: false, askConfirm: false });
              STORAGE_STATE.lastSyncedAt = lastSyncedAt || STORAGE_STATE.lastSyncedAt || '';
            }
          }
        }
      } catch (e) {
        console.warn('saved folder auto-import skipped', e);
      }
    }
    if (handle && STORAGE_STATE.realtimeSync) startRemoteWatch();
  } catch (e) {
    console.error(e);
    STORAGE_STATE.status = 'browser';
  }
}

function scheduleFolderSync() {
  if (!STORAGE_STATE.folderHandle || !STORAGE_STATE.realtimeSync) return;
  if (STORAGE_STATE.syncTimer) clearTimeout(STORAGE_STATE.syncTimer);
  STORAGE_STATE.syncTimer = setTimeout(() => {
    syncAllDataToChosenFolder(false).catch(err => console.error(err));
  }, 700);
}

async function toggleRealtimeSync() {
  STORAGE_STATE.realtimeSync = !STORAGE_STATE.realtimeSync;
  try { await putSetting('realtimeSync', STORAGE_STATE.realtimeSync); } catch (e) { console.error(e); }

  if (!STORAGE_STATE.realtimeSync) {
    stopRemoteWatch();
    if (STORAGE_STATE.syncTimer) {
      clearTimeout(STORAGE_STATE.syncTimer);
      STORAGE_STATE.syncTimer = null;
    }
    toast(t('リアルタイム同期をOFFにしました。以後は「保存先から読み込む」または「保存先へ書き出し」を押すまで同期しません'));
  } else {
    toast(t('リアルタイム同期をONにしました'));
    if (STORAGE_STATE.folderHandle) {
      startRemoteWatch();
      scheduleFolderSync();
    }
  }
  renderSidebar();
}

async function chooseStorageFolder() {
  if (!STORAGE_STATE.available) {
    alert(t('このブラウザでは保存先フォルダの指定に対応していません。Chrome / Edge 系ブラウザを利用してください。'));
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const ok = await ensureFolderPermission(handle);
    if (!ok) throw new Error(t('保存先フォルダへのアクセスが許可されませんでした'));
    STORAGE_STATE.folderHandle = handle;
    STORAGE_STATE.folderName = handle.name || '';
    STORAGE_STATE.status = 'folder';
    await putSetting('storageFolderHandle', handle);
    await putSetting('storageFolderName', STORAGE_STATE.folderName);
    await putSetting('realtimeSync', STORAGE_STATE.realtimeSync);
    renderSidebar();
    if (STORAGE_STATE.realtimeSync) startRemoteWatch();

    let hasRemoteLibrary = false;
    try {
      await handle.getFileHandle('bunken-library.json');
      hasRemoteLibrary = true;
    } catch (_) {}

    if (!STORAGE_STATE.realtimeSync) {
      STORAGE_STATE.remoteDiff = hasRemoteLibrary && STORAGE_STATE.syncBaseline
        ? await refreshRemoteDiff()
        : STORAGE_STATE.remoteDiff;
      renderSidebar();
      toast(t('保存先を設定しました。リアルタイム同期OFFのため、読み込みや同期は手動で行ってください'));
      return;
    }

    if (hasRemoteLibrary) {
      const shouldImport = confirm(t('保存先に既存の bunken-library.json が見つかりました。このフォルダのデータを読み込みますか？\n「キャンセル」を選ぶと、現在のブラウザ内データをこのフォルダへ同期します。'));
      if (shouldImport) {
        await importDataFromFolder(handle, { replaceExisting: true, showToast: true, askConfirm: false });
        return;
      }
    }

    await syncAllDataToChosenFolder(true);
  } catch (e) {

async function clearStorageFolder() {
  STORAGE_STATE.folderHandle = null;
  STORAGE_STATE.folderName = '';
  STORAGE_STATE.status = 'browser';
  STORAGE_STATE.lastSyncedAt = '';
  STORAGE_STATE.remoteDiff = { added: 0, removed: 0, modified: 0 };
  stopRemoteWatch();
  if (STORAGE_STATE.syncTimer) clearTimeout(STORAGE_STATE.syncTimer);
  try {
    await deleteSetting('storageFolderHandle');
    await deleteSetting('storageFolderName');
    await deleteSetting('lastSyncedAt');
    await deleteSetting('syncedPaths');
    await deleteSetting('syncBaseline');
  } catch (e) {
    console.error(e);
  }

  toast(t('ブラウザ保存モードに戻しました'));
}

async function getOrCreateDirectory(parentHandle, name) {
  return parentHandle.getDirectoryHandle(name, { create: true });
}

async function writeBlobToFile(dirHandle, fileName, blob) {
  const fh = await dirHandle.getFileHandle(fileName, { create: true });
  const writable = await fh.createWritable();
  await writable.write(blob);
  await writable.close();
}

async function removeRelativePath(rootHandle, relPath) {
  if (!rootHandle || !relPath) return;
  const parts = String(relPath).split('/').filter(Boolean);
  if (!parts.length) return;
  let current = rootHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    current = await current.getDirectoryHandle(parts[i]);
  }
  await current.removeEntry(parts[parts.length - 1]);
}

async function writeJsonFile(rootHandle, fileName, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  await writeBlobToFile(rootHandle, fileName, blob);
}

async function readJsonFile(rootHandle, fileName) {
  const fh = await rootHandle.getFileHandle(fileName);
  const file = await fh.getFile();
  return JSON.parse(await file.text());
}

async function readRelativeFile(rootHandle, relPath) {
  if (!rootHandle || !relPath) return null;
  const parts = String(relPath).split('/').filter(Boolean);
  if (!parts.length) return null;
  let current = rootHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    current = await current.getDirectoryHandle(parts[i]);
  }
  const fh = await current.getFileHandle(parts[parts.length - 1]);
  return await fh.getFile();
}

async function importDataFromFolder(handle, opts = {}) {
  const options = Object.assign({ replaceExisting: true, showToast: true, askConfirm: false }, opts || {});
  if (!handle) throw new Error(t('保存先フォルダが選択されていません'));
  const ok = await ensureFolderPermission(handle);
  if (!ok) throw new Error(t('保存先フォルダへのアクセス権限がありません'));

  let data;
  try {
    data = await readJsonFile(handle, 'bunken-library.json');
  } catch (e) {
    throw new Error(t('bunken-library.json を読み込めませんでした'));
  }

  if (!data || !Array.isArray(data.papers)) {
    throw new Error(t('bunken-library.json の形式が不正です'));
  }

  if (options.askConfirm) {
    const msg = options.replaceExisting
      ? t('保存先の bunken-library.json を読み込んで、現在のライブラリを置き換えますか？')
      : t('保存先の bunken-library.json を読み込んで、現在のライブラリに追加しますか？');
    if (!confirm(msg)) return false;
  }

  const importedPapers = data.papers.map(normalizePaper);
  const importedCollections = Array.isArray(data.collections) ? data.collections.map(normalizeCollection) : [];

  for (const paper of importedPapers) {
    if (paper.hasPdf && paper.pdfId && paper.pdfPath) {
      try {
        const pdfFile = await readRelativeFile(handle, paper.pdfPath);
        if (pdfFile) await putPdfBlob(paper.pdfId, pdfFile);
      } catch (e) {
        console.warn('PDF import skipped', paper.pdfPath, e);
      }
    }

    for (const meta of (paper.supplementalFiles || [])) {
      if (!meta.id || !meta.path) continue;
      try {
        const suppFile = await readRelativeFile(handle, meta.path);
        if (suppFile) await putMaterialBlob(meta.id, suppFile);
      } catch (e) {
        console.warn('Supplement import skipped', meta.path, e);
      }
    }
  }

  if (options.replaceExisting) {
    S.papers = importedPapers;
    S.collections = importedCollections;
  } else {
    const existingPaperIds = new Set(S.papers.map(p => p.id));
    const existingCollectionIds = new Set(S.collections.map(c => c.id));
    importedPapers.forEach(p => {
      if (!existingPaperIds.has(p.id)) S.papers.push(p);
    });
    importedCollections.forEach(c => {
      if (!existingCollectionIds.has(c.id)) S.collections.push(c);
    });
  }

  S.selectedId = S.papers[0] ? S.papers[0].id : null;
  STORAGE_STATE.folderHandle = handle;
  STORAGE_STATE.folderName = STORAGE_STATE.folderName || handle.name || '';
  STORAGE_STATE.status = 'folder';
  setSyncBaseline({ papers: S.papers, collections: S.collections });
  STORAGE_STATE.syncSuspended = true;
  try { save(); } finally { STORAGE_STATE.syncSuspended = false; }
  try {
    await putSetting('storageFolderHandle', handle);
    await putSetting('storageFolderName', STORAGE_STATE.folderName);
  } catch (_) {}
  if (STORAGE_STATE.realtimeSync) startRemoteWatch();
  await refreshRemoteDiff();
  render();
  if (options.showToast) toast(t('保存先フォルダから読み込みました'));
  return true;
}

async function importDataFromChosenFolderPrompt() {
  if (!STORAGE_STATE.folderHandle) {
    alert(t('先に保存先フォルダを選択してください'));
    return;
  }
  try {
    await importDataFromFolder(STORAGE_STATE.folderHandle, { replaceExisting: true, showToast: true, askConfirm: true });
  } catch (e) {
    console.error(e);
    alert(t('保存先からの読み込みに失敗しました: ') + e.message);
  }
}

async function syncAllDataToChosenFolder(showToast = false) {
  if (!STORAGE_STATE.folderHandle) return false;
  if (STORAGE_STATE.syncTimer) {
    clearTimeout(STORAGE_STATE.syncTimer);
    STORAGE_STATE.syncTimer = null;
  }
  if (STORAGE_STATE.syncInFlight) return STORAGE_STATE.syncInFlight;

  STORAGE_STATE.syncInFlight = (async () => {
    const handle = STORAGE_STATE.folderHandle;
    const ok = await ensureFolderPermission(handle, { request: showToast });
    if (!ok) {
      if (!showToast) {
        toast(t('保存先フォルダの権限がないため、自動同期を停止しました'));
        return false;
      }
      throw new Error(t('保存先フォルダへの書き込み権限がありません'));
    }

    await refreshRemoteDiff();
    if (diffHasChanges(STORAGE_STATE.remoteDiff)) {
      if (!showToast) {
        toast(t('保存先に別の変更があるため、自動同期を停止しました'));
        return false;
      }
      const overwrite = confirm(t('保存先に別の変更があります。現在のブラウザの内容で上書きしますか？\nキャンセルすると保存先は変更されません。'));
      if (!overwrite) return false;
    }
    let remoteFingerprintAtStart = '';
    try { remoteFingerprintAtStart = stableFingerprint(await readJsonFile(handle, 'bunken-library.json')); }
    catch (_) {}

    const pdfDir = await getOrCreateDirectory(handle, 'pdfs');
    const suppDir = await getOrCreateDirectory(handle, 'supplementals');
    const currentPaths = [];
    const usedPdfNames = new Set();
    const usedSupplementNames = new Set();

    const nextPapers = S.papers.map(paper => normalizePaper(JSON.parse(JSON.stringify(paper))));
    for (const paper of nextPapers) {
      if (paper.hasPdf && paper.pdfId) {
        const rec = await getPdfBlob(paper.pdfId);
        if (rec && rec.blob) {
          const ext = getFileExtension(paper.pdfOriginalName || paper.pdfName || rec.name || 'paper.pdf', rec.type || 'application/pdf', 'pdf');
          const storedName = dedupeFileName(buildStoredFileName(paper, { kind: 'pdf', ext }), usedPdfNames);
          await writeBlobToFile(pdfDir, storedName, rec.blob);
          paper.pdfName = storedName;
          paper.pdfPath = `pdfs/${storedName}`;
          currentPaths.push(paper.pdfPath);
        }
      }

      for (const meta of (paper.supplementalFiles || [])) {
        const rec = await getMaterialBlob(meta.id);
        if (rec && rec.blob) {
          const ext = getFileExtension(meta.originalName || meta.name || rec.name || 'attachment', rec.type || meta.type || 'application/octet-stream', 'bin');
          const slot = Number.isFinite(meta.slot) ? meta.slot : 1;
          const storedName = dedupeFileName(buildStoredFileName(paper, { kind: 'supplement', slot, ext }), usedSupplementNames);
          await writeBlobToFile(suppDir, storedName, rec.blob);
          meta.name = storedName;
          meta.path = `supplementals/${storedName}`;
          currentPaths.push(meta.path);
        }
      }
    }

    const exportData = {
      savedAt: new Date().toISOString(),
      papers: nextPapers,
      collections: S.collections
    };
    let latestRemoteFingerprint = '';
    try { latestRemoteFingerprint = stableFingerprint(await readJsonFile(handle, 'bunken-library.json')); }
    catch (_) {}
    if (latestRemoteFingerprint !== remoteFingerprintAtStart) {
      throw new Error(t('同期中に保存先が更新されたため、ライブラリの上書きを中止しました'));
    }
    await writeJsonFile(handle, 'bunken-library.json', exportData);
    S.papers = nextPapers;

    const oldPathsRaw = await getSetting('syncedPaths');
    const oldPaths = Array.isArray(oldPathsRaw) ? oldPathsRaw : [];
    for (const oldPath of oldPaths) {
      if (!currentPaths.includes(oldPath)) {
        try { await removeRelativePath(handle, oldPath); } catch (_) {}
      }
    }

    STORAGE_STATE.lastSyncedAt = new Date().toISOString();
    setSyncBaseline({ papers: S.papers, collections: S.collections });
    STORAGE_STATE.remoteLastSeenSavedAt = exportData.savedAt;
    STORAGE_STATE.remoteLastSeenFingerprint = stableFingerprint(exportData);
    await putSetting('syncedPaths', currentPaths);
    await putSetting('lastSyncedAt', STORAGE_STATE.lastSyncedAt);
    await putSetting('storageFolderName', STORAGE_STATE.folderName || handle.name || '');
    await putSetting('syncBaseline', STORAGE_STATE.syncBaseline);

    STORAGE_STATE.syncSuspended = true;
    try { save(); } finally { STORAGE_STATE.syncSuspended = false; }
    if (STORAGE_STATE.realtimeSync) startRemoteWatch();
    await refreshRemoteDiff();
    render();
    if (showToast) toast(t('保存先フォルダへ同期しました'));
    return true;
  })();

  try {
    return await STORAGE_STATE.syncInFlight;
  } finally {
    STORAGE_STATE.syncInFlight = null;
  }
}

/* ============================================================
   HELPERS
============================================================ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,9); }

function h(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function decodeEntities(s) {
  const ta = document.createElement('textarea');
  ta.innerHTML = String(s ?? '');
  return ta.value;
}

function plainText(s) {
  const tpl = document.createElement('template');
  tpl.innerHTML = decodeEntities(s);
  return (tpl.content.textContent || '').replace(/\s+/g, ' ').trim();
}

function richInline(s) {
  const allowed = new Set(['I','EM','B','STRONG','SUB','SUP']);
  const tpl = document.createElement('template');
  tpl.innerHTML = decodeEntities(s);
  const walk = (node) => {
    if (node.nodeType === Node.TEXT_NODE) return;
    if (node.nodeType !== Node.ELEMENT_NODE) { node.remove(); return; }
    Array.from(node.childNodes).forEach(walk);
    if (!allowed.has(node.tagName)) {
      node.replaceWith(document.createTextNode(node.textContent || ''));
      return;
    }
    while (node.attributes.length) node.removeAttribute(node.attributes[0].name);
  };
  Array.from(tpl.content.childNodes).forEach(walk);
  return tpl.innerHTML;
}

/* ============================================================
   BIBLIOGRAPHIC TEXT CLEANUP
   Crossref / PDF / BibTeX / arXiv metadata often carries HTML, JATS,
   MathML, HTML entities, LaTeX commands, ligatures, odd spaces and
   font-encoding artefacts. Everything is normalised here, and
   normalizePaper() applies it to every stored paper (so previously
   saved libraries are repaired when they are loaded).
============================================================ */
const BIB_LIGATURES = { 'ﬀ': 'ff', 'ﬁ': 'fi', 'ﬂ': 'fl', 'ﬃ': 'ffi', 'ﬄ': 'ffl', 'ﬅ': 'st', 'ﬆ': 'st' };

// DOM node -> text. keep=true retains <sub>/<sup>/<i>/<b>; everything else is flattened.
function bibNodeToText(node, keep) {
  if (node.nodeType === 3) {
    const txt = node.nodeValue || '';
    return keep ? txt.replace(/&(?=#?[a-z0-9]+;)/gi, '&amp;').replace(/</g, '&lt;') : txt;
  }
  if (node.nodeType !== 1 && node.nodeType !== 11) return '';
  const name = String(node.localName || node.nodeName || '').toLowerCase().replace(/^.*:/, '');
  const kids = Array.from(node.childNodes);
  const inner = () => kids.map(k => bibNodeToText(k, keep)).join('');
  const els = () => kids.filter(k => k.nodeType === 1);
  const sub = (el, tag) => el ? ((s => (keep && s ? `<${tag}>${s}</${tag}>` : s))(bibNodeToText(el, keep).trim())) : '';
  const mark = (tag, body) => (keep && body.trim()) ? `<${tag}>${body}</${tag}>` : body;
  switch (name) {
    case 'script': case 'style': return '';
    case 'sub': case 'sup': return mark(name, inner().trim());
    case 'i': case 'em': case 'italic': return mark('i', inner());
    case 'b': case 'strong': case 'bold': return mark('b', inner());
    // MathML (Crossref sometimes embeds <mml:math> in titles)
    case 'msub': { const [a, b] = els(); return (a ? bibNodeToText(a, keep) : '') + sub(b, 'sub'); }
    case 'msup': { const [a, b] = els(); return (a ? bibNodeToText(a, keep) : '') + sub(b, 'sup'); }
    case 'msubsup': { const [a, b, c] = els(); return (a ? bibNodeToText(a, keep) : '') + sub(b, 'sub') + sub(c, 'sup'); }
    case 'mfrac': { const [a, b] = els(); return `${a ? bibNodeToText(a, keep) : ''}/${b ? bibNodeToText(b, keep) : ''}`; }
    // JATS / block-ish elements -> whitespace
    case 'title':
      if (/^\s*abstract\s*$/i.test(node.textContent || '')) return ' ';
      return ' ' + inner() + ' ';
    case 'p': case 'div': case 'br': case 'li': case 'sec': return ' ' + inner() + ' ';
    default: return inner();
  }
}

// value -> clean text.
//   keep   : keep <sub>/<sup>/<i>/<b> (titles); otherwise plain text
//   opts   : { abstract: strip leading "Abstract", symbolFix: repair Elsevier symbol-font artefacts }
function cleanBibText(value, keep = false, opts = {}) {
  let s = String(value ?? '');
  if (!s) return '';
  // UTF-16 strings read as bytes ("T\0i\0t\0l\0e") and leaked BOM markers ("þÿ…")
  s = s.replace(/^(?:þÿ|ÿþ|﻿|￾)/, '');
  if (s.includes('\u0000')) s = s.replace(/\u0000/g, '');
  if (/[<&]/.test(s)) {
    // double-encoded markup (&lt;i&gt;…) -> real markup
    if (/&lt;\/?(?:sub|sup|i|b|em|strong|scp|math|mml:|jats:)/i.test(s)) s = decodeEntities(s);
    s = s
      // no whitespace just inside / before sub & sup
      .replace(/\s+(?=<(?:jats:)?(?:sub|sup)\b)/gi, '')
      .replace(/(<(?:jats:)?(?:sub|sup)>)\s+/gi, '$1')
      .replace(/\s+(?=<\/(?:jats:)?(?:sub|sup)>)/gi, '')
      // publishers often forget the space around inline markup
      .replace(/([A-Za-z0-9])(?=<(?:\w+:)?math\b)/g, '$1 ')
      .replace(/(<\/(?:\w+:)?math>)(?=[A-Za-z0-9(])/g, '$1 ')
      .replace(/([A-Za-z0-9])(<(i|em|jats:italic)>[^<]{3,}<\/\3>)/gi, '$1 $2')
      .replace(/(<(i|em|jats:italic)>[^<]{3,}<\/\2>)(?=[A-Za-z0-9])/gi, '$1 ')
      .replace(/(<\/(?:jats:)?(?:sub|sup)>)(?=[a-z]{2,}|[A-Z][a-z]{2,})/g, '$1 ');
    const tpl = document.createElement('template');
    tpl.innerHTML = s;
    s = bibNodeToText(tpl.content, keep);
  }
  s = s
    .replace(/[\u0000-\u001f\u007f]/g, ' ')
    .replace(/[  -   　]/g, ' ')
    .replace(/[​-‍⁠﻿­]/g, '')
    .replace(/[‐‑]/g, '-')
    .replace(/[ﬀ-ﬆ]/g, ch => BIB_LIGATURES[ch] || ch);
  if (opts.symbolFix) s = s.replace(/(?<=[0-9A-Za-z)\]])þ(?![a-z])/g, '+').replace(/\/C0/g, '−');
  s = s.replace(/\s+/g, ' ').trim();
  if (keep) s = s.replace(/<(sub|sup|i|b)>\s*<\/\1>/g, '');
  if (opts.abstract) s = s.replace(/^Abstract(?=[A-Z0-9(‘“"])/, '');
  return s;
}

/* ---- LaTeX -> text (BibTeX import, arXiv) ---- */
const TEX_ACCENT = { '"': '̈', "'": '́', '`': '̀', '^': '̂', '~': '̃', '=': '̄', '.': '̇', c: '̧', v: '̌', u: '̆', H: '̋', k: '̨', r: '̊' };
const TEX_LETTERS = { ss: 'ß', aa: 'å', AA: 'Å', ae: 'æ', AE: 'Æ', oe: 'œ', OE: 'Œ', o: 'ø', O: 'Ø', l: 'ł', L: 'Ł', i: 'ı', j: 'ȷ' };
const TEX_GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', vartheta: 'ϑ', iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', upsilon: 'υ', phi: 'φ', varphi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω', Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Xi: 'Ξ', Pi: 'Π', Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω' };
const TEX_SYMBOLS = { times: '×', pm: '±', approx: '≈', sim: '∼', leq: '≤', le: '≤', geq: '≥', ge: '≥', neq: '≠', to: '→', rightarrow: '→', leftarrow: '←', leftrightarrow: '↔', rightleftharpoons: '⇌', circ: '°', cdot: '·', infty: '∞', AA: 'Å' };

function texMathToInline(math, keep) {
  let out = String(math);
  for (let i = 0; i < 4; i++) {
    out = out.replace(/\\(?:mathrm|mathit|mathbf|mathsf|mathcal|text|textrm|textit|rm|it|bf)\s*\{([^{}]*)\}/g, '$1');
  }
  out = out.replace(/\\([A-Za-z]+)\s*/g, (_, n) => TEX_GREEK[n] ?? TEX_SYMBOLS[n] ?? '');
  const wrap = (tag, body) => keep ? `<${tag}>${body}</${tag}>` : body;
  out = out.replace(/_\s*\{([^{}]*)\}|_\s*([A-Za-z0-9+\-])/g, (_, a, b) => wrap('sub', a ?? b));
  out = out.replace(/\^\s*\{([^{}]*)\}|\^\s*([A-Za-z0-9+\-])/g, (_, a, b) => wrap('sup', a ?? b));
  return out.replace(/[{}]/g, '');
}

function texToText(value, keep = false, opts = {}) {
  let s = String(value ?? '');
  if (!/[\\${}~]|--|``|''/.test(s)) return cleanBibText(s, keep, opts);
  s = s.replace(/\\\$/g, '\u0001');
  s = s.replace(/\$([^$]*)\$/g, (_, m) => texMathToInline(m, keep));
  s = s
    .replace(/\\(["'`^~=.])\s*(?:\{\s*(\\?[A-Za-z])\s*\}|(\\?[A-Za-z]))/g,
      (_, acc, a, b) => (String(a || b).replace('\\', '') + TEX_ACCENT[acc]).normalize('NFC'))
    .replace(/\\([cvuHkr])(?:\s*\{\s*([A-Za-z])\s*\}|\s+([A-Za-z]))/g,
      (_, acc, a, b) => ((a || b) + TEX_ACCENT[acc]).normalize('NFC'))
    .replace(/\\(ss|aa|AA|ae|AE|oe|OE|o|O|l|L|i|j)(?![A-Za-z])(?:\{\}|\s)?/g, (_, n) => TEX_LETTERS[n]);
  const tagWrap = tag => (_, body) => keep ? `<${tag}>${body}</${tag}>` : body;
  for (let i = 0; i < 3; i++) s = s.replace(/(^|[^\\A-Za-z*])\{([^{}\\]*)\}/g, '$1$2');   // protective braces {YSZ}
  for (let i = 0; i < 4; i++) {
    s = s
      .replace(/\\(?:textit|emph|textsl)\s*\{([^{}]*)\}/g, tagWrap('i'))
      .replace(/\\textbf\s*\{([^{}]*)\}/g, tagWrap('b'))
      .replace(/\\textsubscript\s*\{([^{}]*)\}/g, tagWrap('sub'))
      .replace(/\\textsuperscript\s*\{([^{}]*)\}/g, tagWrap('sup'))
      .replace(/\\(?:textrm|textsc|textsf|texttt|textnormal|textup|mbox|text|mathrm|ensuremath|url)\s*\{([^{}]*)\}/g, '$1');
  }
  s = s
    .replace(/\\([&%_#])/g, '$1')
    .replace(/\u0001/g, '$')
    .replace(/---/g, '—').replace(/--/g, '–')
    .replace(/``/g, '“').replace(/''/g, '”')
    .replace(/\\[,;:! ]/g, ' ').replace(/\\-/g, '')
    .replace(/\\[A-Za-z]+\*?\s*/g, '')
    .replace(/[{}]/g, '');
  if (opts.tilde !== false) s = s.replace(/~/g, ' ');
  return cleanBibText(s, keep, opts);
}

// For use in data attributes — escape single quotes
function oa(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function sanitizeFilePart(s) {
  const txt = plainText(s || '').normalize('NFKC');
  return txt
    .replace(/[\\/:*?"<>|]/g, '_')
    .replace(/[\u0000-\u001f\u007f]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/[.]+$/g, '')
    .trim()
    .slice(0, 80) || 'unknown';
}

function primaryAuthorName(paper) {
  const raw = (paper.authors && paper.authors[0]) ? paper.authors[0] : 'unknown';
  const head = raw.includes(',') ? raw.split(',')[0] : raw.split(/\s+/).filter(Boolean).slice(-1)[0];
  return sanitizeFilePart(head || 'unknown');
}

function getFileExtension(name, mimeType = '', fallback = 'bin') {
  const fromName = String(name || '').match(/\.([A-Za-z0-9]{1,10})$/);
  if (fromName) return fromName[1].toLowerCase();
  if ((mimeType || '').includes('pdf')) return 'pdf';
  return fallback;
}

function buildStoredFileName(paper, { kind = 'pdf', slot = 1, ext = 'pdf' } = {}) {
  const base = [
    primaryAuthorName(paper),
    sanitizeFilePart(paper.title || 'untitled'),
    sanitizeFilePart(paper.journal || 'unknown-journal'),
    sanitizeFilePart(paper.year || 'unknown-year')
  ].join('_');
  const suffix = kind === 'supplement' ? `_S${slot}` : '';
  return `${base}${suffix}.${ext}`;
}

function dedupeFileName(fileName, usedNames) {
  if (!usedNames) return fileName;
  if (!usedNames.has(fileName)) {
    usedNames.add(fileName);
    return fileName;
  }
  const m = String(fileName).match(/^(.*?)(\.([^.]+))?$/);
  const stem = m ? m[1] : fileName;
  const dotExt = m && m[2] ? m[2] : '';
  let n = 2;
  let candidate = `${stem}_${n}${dotExt}`;
  while (usedNames.has(candidate)) {
    n += 1;
    candidate = `${stem}_${n}${dotExt}`;
  }
  usedNames.add(candidate);
  return candidate;
}

function nextSupplementSlot(paper) {
  const used = new Set((paper.supplementalFiles || []).map(f => Number.isFinite(f.slot) ? f.slot : null).filter(v => v != null));
  let slot = 1;
  while (used.has(slot)) slot += 1;
  return slot;
}

function fmtSyncTime(iso) {
  if (!iso) return t('未同期');
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return t('未同期');
  return d.toLocaleString(LANG === 'en' ? 'en-US' : 'ja-JP');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2600);
}

function safeDoiUrl(doi) {
  const cleaned = sanitizeText(doi, 256);
  if (!cleaned) return '';
  return `https://doi.org/${encodeURIComponent(cleaned).replace(/%2F/g, '/')}`;
}

function safeArxivUrl(arxivId) {
  const cleaned = sanitizeText(arxivId, 128).replace(/\s+/g, '');
  if (!cleaned) return '';
  return `https://arxiv.org/abs/${encodeURIComponent(cleaned).replace(/%2F/g, '/')}`;
}

function clampSidebarWidth(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return SIDEBAR_DEFAULT_WIDTH;
  return Math.max(SIDEBAR_MIN_WIDTH, Math.min(SIDEBAR_MAX_WIDTH, Math.round(n)));
}

function applySidebarWidth(value, persist = false) {
  const w = clampSidebarWidth(value);
  document.documentElement.style.setProperty('--sidebar-w', `${w}px`);
  if (persist) {
    try { localStorage.setItem(SIDEBAR_WIDTH_KEY, String(w)); } catch (_) {}
  }
}

function restoreSidebarWidth() {
  try {
    const saved = localStorage.getItem(SIDEBAR_WIDTH_KEY);
    if (saved) applySidebarWidth(saved, false);
  } catch (_) {}
}

function initSidebarResize() {
  const resizer = document.getElementById('sidebar-resizer');
  const sidebar = document.getElementById('sidebar');
  if (!resizer || !sidebar) return;
  let startX = 0;
  let startW = SIDEBAR_DEFAULT_WIDTH;
  const stop = () => {
    document.body.classList.remove('sidebar-resizing');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', stop);
    window.removeEventListener('pointercancel', stop);
  };
  const move = (e) => {
    applySidebarWidth(startW + e.clientX - startX, true);
  };
  resizer.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startW = sidebar.getBoundingClientRect().width;
    document.body.classList.add('sidebar-resizing');
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', stop);
    window.addEventListener('pointercancel', stop);
  });
  resizer.addEventListener('dblclick', () => applySidebarWidth(SIDEBAR_DEFAULT_WIDTH, true));
}

function clampListPaneWidth(value) {

/* ============================================================
   BIBTEX KEY
============================================================ */
function bKey(p) {
  const skip = /^(the|and|for|with|from|into|over|upon|this|that|a|an|in|on|of|to|at|by|is)$/i;
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  let fa = 'unknown';
  const a0 = p.authors && p.authors[0] ? plainText(p.authors[0]) : '';
  if (a0) {
    const surname = a0.includes(',') ? a0.split(',')[0] : a0.trim().split(/\s+/).pop();
    fa = fold(surname).slice(0, 10) || 'unknown';
  }
  const yr = p.year || 'xxxx';
  const titleText = plainText(p.title || '');
  const tw = titleText.split(/\s+/)
    .find(w => w.length > 3 && !skip.test(w)) || titleText.split(/\s+/)[0] || 'paper';
  return normalizeBibKey(fa + yr + (fold(tw).slice(0, 8) || 'paper')) || `ref${yr}`;
}

function findDuplicateBibKey(key, excludeId = '') {
  const normalized = normalizeBibKey(key).toLowerCase();
  return normalized ? S.papers.find(p => p.id !== excludeId && normalizeBibKey(p.bibtexKey || bKey(p)).toLowerCase() === normalized) : null;
}

function nextAvailableBibKey(base, usedKeys = new Set(), excludeId = '') {
  const clean = normalizeBibKey(base) || 'reference';
  const used = new Set([
    ...S.papers.filter(p => p.id !== excludeId).map(p => normalizeBibKey(p.bibtexKey || bKey(p)).toLowerCase()),
    ...[...usedKeys].map(k => String(k).toLowerCase())
  ]);
  if (!used.has(clean.toLowerCase())) return clean;
  for (let suffix = 0; suffix < 26; suffix++) {
    const candidate = `${clean}${String.fromCharCode(97 + suffix)}`;
    if (!used.has(candidate.toLowerCase())) return candidate;
  }
  let n = 2;
  while (used.has(`${clean}${n}`.toLowerCase())) n++;
  return `${clean}${n}`;
}

/* ============================================================
   BIBTEX PARSER
============================================================ */
function splitBibEntries(text) {
  const source = String(text || '').split(/\r?\n/).map(line => {
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '%' && line[i - 1] !== '\\') return line.slice(0, i);
    }
    return line;
  }).join('\n');
  const entries = [];
  let cursor = 0;
  while (cursor < source.length) {
    const match = /@([A-Za-z]+)\s*([\{(])/g;
    match.lastIndex = cursor;
    const found = match.exec(source);
    if (!found) break;
    const type = found[1].toLowerCase();
    const open = found[2], close = open === '{' ? '}' : ')';
    let depth = 1, quoted = false, escaped = false, end = match.lastIndex;
    for (; end < source.length; end++) {
      const ch = source[end];
      if (escaped) { escaped = false; continue; }
      if (ch === '\\') { escaped = true; continue; }
      if (ch === '"') { quoted = !quoted; continue; }
      if (quoted) continue;
      if (ch === open) depth++;
      else if (ch === close && --depth === 0) { end++; break; }
    }
    if (depth !== 0) throw new Error(t('{type} エントリの括弧が閉じていません', { type: found[1] }));
    if (!['comment', 'preamble', 'string'].includes(type)) entries.push(source.slice(found.index, end));
    cursor = end;
  }
  return entries;
}

function findTopLevelComma(text) {
  let depth = 0, quoted = false, escaped = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (escaped) { escaped = false; continue; }
    if (ch === '\\') { escaped = true; continue; }
    if (ch === '"') { quoted = !quoted; continue; }
    if (quoted) continue;
    if (ch === '{') depth++;
    else if (ch === '}') depth--;
    else if (ch === ',' && depth === 0) return i;
  }
  return -1;
}

// Return the index just after the brace that closes the one at start.
function bibSkipBraces(str, start) {
  let depth = 0;
  for (let i = start; i < str.length; i++) {
    const c = str[i];
    if (c === '\\') { i++; continue; }
    if (c === '{') depth++;
    else if (c === '}') { depth--; if (depth === 0) return i + 1; }
  }
  return str.length;
}

// Read a field value in braces, quotes or bare text, including # concatenation.
function bibReadValue(str, pos) {
  let value = '';
  let i = pos;
  while (i < str.length) {
    while (/\s/.test(str[i] || '')) i++;
    const c = str[i];
    if (c === '{') {
      const end = bibSkipBraces(str, i);
      value += str.slice(i + 1, str[end - 1] === '}' ? end - 1 : end);
      i = end;
    } else if (c === '"') {
      let j = i + 1, depth = 0;
      for (; j < str.length; j++) {
        const d = str[j];
        if (d === '\\') { j++; continue; }
        if (d === '{') depth++;
        else if (d === '}') depth--;
        else if (d === '"' && depth === 0) break;
      }
      value += str.slice(i + 1, j);
      i = j + 1;
    } else {
      const m = /^[^,{}"#\s]+/.exec(str.slice(i));
      if (!m) break;
      value += m[0];
      i += m[0].length;
    }
    while (/\s/.test(str[i] || '')) i++;
    if (str[i] === '#') { i++; continue; }
    break;
  }
  return { value, next: i };
}

function parseBibFields(text) {
  const fields = {};
  let i = 0;
  while (i < text.length) {
    while (i < text.length && /[\s,]/.test(text[i])) i++;
    const nameMatch = /^[A-Za-z][\w:-]*/.exec(text.slice(i));
    if (!nameMatch) { i++; continue; }
    const name = nameMatch[0].toLowerCase();
    i += nameMatch[0].length;
    while (/\s/.test(text[i] || '')) i++;
    if (text[i] !== '=') { while (i < text.length && text[i] !== ',') i++; continue; }
    i++;
    while (/\s/.test(text[i] || '')) i++;
    const parsed = bibReadValue(text, i);
    fields[name] = parsed.value.trim();
    i = Math.max(parsed.next, i + 1);
  }
  return fields;
}

function splitBibAuthors(value) {
  const authors = [];
  let depth = 0, start = 0;
  const text = String(value || '');
  for (let i = 0; i < text.length; i++) {
    if (text[i] === '{') depth++;
    else if (text[i] === '}') depth--;
    else if (depth === 0 && /^\s+and\s+/i.test(text.slice(i))) {
      authors.push(text.slice(start, i).trim());
      const separator = /^\s+and\s+/i.exec(text.slice(i))[0];
      i += separator.length - 1;
      start = i + 1;
    }
  }
  authors.push(text.slice(start).trim());
  return authors.filter(Boolean);
}

function parseBibEntry(txt) {
  const source = String(txt || '').trim();
  const match = /^@([A-Za-z]+)\s*([\{(])/.exec(source);
  if (!match || !/[})]$/.test(source)) throw new Error(t('BibTeXエントリを解析できません'));
  const sourceType = match[1].toLowerCase();
  const body = source.slice(match[0].length, -1);
  const comma = findTopLevelComma(body);
  if (comma < 0) throw new Error(t('Citation keyの後にカンマがありません'));
  const bk = normalizeBibKey(body.slice(0, comma));
  const fields = parseBibFields(body.slice(comma + 1));
  const T = (value, keep = false, opts = {}) => texToText(value, keep, { ...opts, symbolFix: true });
  const unTex = value => String(value || '').replace(/\\([_%&#$])/g, '$1').trim();
  const authors = splitBibAuthors(fields.author).map(author => T(author)).filter(Boolean);
  const typeMap = {
    article:'article', inproceedings:'inproceedings', conference:'inproceedings',
    incollection:'inproceedings', book:'book', booklet:'book', preprint:'preprint',
    misc:'misc', online:'misc', techreport:'misc', phdthesis:'phdthesis', mastersthesis:'mastersthesis'
  };
  const type = typeMap[sourceType] || 'misc';
  const yearMatch = String(fields.year || fields.date || '').match(/\d{4}/);
  const prefix = T(fields.archiveprefix || fields.eprinttype || '');
  const eprint = fields.eprint && (!prefix || prefix.toLowerCase() === 'arxiv') ? normalizeArxivId(unTex(fields.eprint)) : '';
  return {
    id: uid(), type, bibtexKey: bk,
    title: T(fields.title, true), authors,
    year: yearMatch ? parseInt(yearMatch[0], 10) : null,
    journal: T(fields.journal || fields.journaltitle || ''),
    booktitle: T(fields.booktitle || ''),
    volume: T(fields.volume), number: T(fields.number),
    pages: T(fields.pages).replace(/\s*[-–—]+\s*/g, '-'),
    publisher: T(fields.publisher), school: T(fields.school || fields.institution),
    doi: normalizeDoi(unTex(fields.doi)),
    arxivId: eprint, archivePrefix: prefix || (eprint ? 'arXiv' : ''),
    primaryClass: T(fields.primaryclass || ''), url: unTex(fields.url),
    abstract: T(fields.abstract, false, { abstract: true }), citationCount: null,
    tags: [], collections: [], starred: false, readStatus: 'unread', notes: '',
    addedAt: new Date().toISOString(),
    pdfId: '', pdfName: '', pdfOriginalName: '', pdfPath: '', hasPdf: false, supplementalFiles: []
  };
}

function parseBibEntries(txt) {
  return splitBibEntries(txt).map(parseBibEntry);
}

function parseBib(txt) {
  return parseBibEntries(txt)[0] || null;
